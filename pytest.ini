# Host tests: the firmware logic (firmware/test_panel.py), code.py against stub hardware
# (firmware/test_code.py) and the label tables (tests/test_labels.py). Importlib mode keeps firmware/ off the front of sys.path, where its code.py would
# shadow the standard library's code module.
[pytest]
addopts = --import-mode=importlib -p no:cacheprovider
testpaths = firmware tests
