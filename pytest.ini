# Host tests: the firmware logic (firmware/test_panel.py), code.py and boot.py on the simulator's stand-in
# hardware (firmware/test_code.py, firmware/test_boot.py), the documented workflows on the simulator
# (tests/test_workflows.py) and the label tables (tests/test_labels.py). Importlib mode keeps firmware/ off
# the front of sys.path, where its code.py would shadow the standard library's code module.
[pytest]
addopts = --import-mode=importlib -p no:cacheprovider
testpaths = firmware tests
