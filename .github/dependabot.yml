# Keeps the workflow actions current. Python tools come from nixpkgs and three.js is vendored in
# viewer/vendor/; Dependabot tracks neither.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release gets a week to show problems before it is proposed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
