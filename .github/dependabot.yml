# Keeps the workflow actions and nixpkgs (the Python tools and linters) current. Dependabot does not track the
# rest, which is moved by hand: three.js in viewer/vendor/, Python's embeddable package for the simulator's zip
# (windows/make_zip.py; in the firmware shell tests/test_windows_zip.py fails when its minor version is not
# the one of nixpkgs' Python), the Python and pytest of the Windows tests (build.yml) and CircuitPython's
# mpy-cross (nix/mpy-cross.nix).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release gets a week to show problems before it is proposed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # nixpkgs, locked in flake.lock (the only flake input, so one pull request at a time): every package
  # build.sh and the linters use. Its build checks that the update leaves every output as it is; one that moves
  # OpenCascade, matplotlib, shapely or librsvg can change outputs (viewer/geometry.js and the fits table of
  # mechanics.md too), and then needs ./build.sh run on its branch.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    # Proposes the nixpkgs-unstable state of a week ago or older, like the actions.
    cooldown:
      default-days: 7
