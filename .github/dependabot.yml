# Keeps the workflow actions and nixpkgs (the Python tools and linters) current. three.js is vendored in
# viewer/vendor/, which Dependabot does not track.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release gets a week to show problems before it is proposed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # nixpkgs, locked in flake.lock (the only flake input, so one pull request at a time): every package
  # build.sh and the linters use. Its build checks that the update leaves every output as it is.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    # Proposes the nixpkgs-unstable state of a week ago or older, like the actions.
    cooldown:
      default-days: 7
