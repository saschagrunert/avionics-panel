name: pages
# Publishes the 3D view (viewer/index.html) to GitHub Pages on every push to main. No paths filter: main is
# force-pushed (one amended commit), and the filter did not start the workflow for those pushes.
on:
  push:
    branches:
      - main
  workflow_dispatch:
# Only the latest viewer matters. A deployment that already started finishes, a newer run waits for it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions: {}
jobs:
  # Packs the viewer without write access; deploy only publishes the artifact. Forks have no Pages of
  # this repository to deploy to.
  build:
    name: pack the viewer
    if: github.repository == 'saschagrunert/avionics-panel'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: viewer
  deploy:
    name: deploy to Pages
    if: github.repository == 'saschagrunert/avionics-panel'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact
      id-token: write # prove the deployment's origin to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
