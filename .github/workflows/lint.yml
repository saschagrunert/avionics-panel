name: lint
# Python (ruff.toml), shell (shellcheck, shfmt with .editorconfig), Markdown (.markdownlint-cli2.yaml),
# the workflows (actionlint) and their security (zizmor). Every tool comes from nixpkgs, like locally.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
# Pull requests cancel their outdated runs; every push to main gets a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  lint:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      actions: write # the cache step deletes superseded caches
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: ruff
            run: ruff check .
          - tool: shellcheck
            run: shellcheck build.sh
          - tool: shfmt
            run: shfmt -d .
          - tool: markdownlint-cli2
            run: markdownlint-cli2
          - tool: actionlint
            run: actionlint
          - tool: zizmor
            run: zizmor --offline .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - id: nixpkgs
        name: nixpkgs revision (cache key)
        run: echo "rev=$(curl -sfL https://channels.nixos.org/nixpkgs-unstable/git-revision)" >>"$GITHUB_OUTPUT"
      # Only main saves; pull requests restore.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ matrix.tool }}-${{ steps.nixpkgs.outputs.rev }}
          restore-prefixes-first-match: nix-${{ matrix.tool }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 1G
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ matrix.tool }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix-shell -p "$TOOL" --run "$RUN"
        env:
          TOOL: ${{ matrix.tool }}
          RUN: ${{ matrix.run }}
