name: windows
# Builds the simulator for Windows (windows/make_zip.py: Python's embeddable package, pinned by its hash, with the
# firmware, the simulator and the viewer) on Linux, keeps it as an artifact of the run, and attaches it to every
# release that is published. Its tests run with the others in build.yml.
on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
# Pull requests cancel their outdated runs. Every other run (a push to main, a release, a manual run) is a group
# of its own, so none replaces another pending one and every release gets its zip.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  zip:
    name: simulator zip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 windows/make_zip.py --out avionics-panel-sim-windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avionics-panel-sim-windows
          path: avionics-panel-sim-windows.zip
          if-no-files-found: error
          # the release keeps its own copy; a run's zip is only for trying a change
          retention-days: 7
  # Only this job may write, and only to the release that started the run.
  release:
    name: attach to the release
    needs: zip
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # upload a release asset
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avionics-panel-sim-windows
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" avionics-panel-sim-windows.zip --repo "$GITHUB_REPOSITORY" --clobber
