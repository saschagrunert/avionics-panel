name: build
# Regenerates every output with ./build.sh, which runs all checks (electrical, DRC, footprints, fit
# clearances, firmware tests), then makes sure the committed outputs are current. Every build uses the
# nixpkgs locked in flake.lock. Dependabot proposes each nixpkgs-unstable update as a pull request, whose
# build is the check that the update leaves every output as it is (so no scheduled run). Dependabot's pull
# requests get a read-only token, which is enough: the cache only restores there, and the cache step uses
# its write access on main only. A push to main that passes also publishes the 3D view, and every build
# that passes sends the firmware tests' coverage to Codecov.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
# Pull requests cancel their outdated runs. Every push to main gets a group of its own: GitHub replaces
# the pending run of a group when a newer one queues, which would leave that commit unchecked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  build:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      actions: write # the cache step deletes superseded caches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # build.sh puts the locked nixpkgs on NIX_PATH itself
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # The Nix store is keyed on flake.lock and the Nix files that define what the build uses, so it hits
      # until one of them changes, MicroPython included (nix/shells.nix builds it without its tests, so
      # cache.nixos.org does not have it). A new key misses: the build restores the latest store (which has
      # most of it) and builds or downloads the rest, and the next run on main saves it under the new key.
      # So a change there (and this key scheme itself) speeds up pull requests from the first main run after
      # its merge. Only main saves, and pull requests restore: one cache per pull request would push the ones
      # of main out of the repository's 10 GB. Main also purges the caches of earlier keys.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-build-${{ hashFiles('flake.lock', 'nix/*.nix', 'firmware/mpy-cross.nix') }}
          restore-prefixes-first-match: nix-build-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 4G
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-build-
          purge-created: 0
          purge-primary-key: never
      - run: ./build.sh
      # With nixpkgs locked, build.sh reproduces every file: any changed, new or deleted output fails. On a
      # Dependabot pull request, that means the nixpkgs update changes an output (STEP, STL, PDF and PNG
      # files follow OpenCascade and matplotlib): run build.sh on its branch and commit the result.
      - name: Committed outputs are up to date
        run: |
          git status --short
          if [ -n "$(git status --porcelain)" ]; then
            git diff --stat
            echo "::error::build.sh changed, added or removed outputs: run it and commit the result"
            exit 1
          fi
      # Sends the firmware tests' coverage (coverage.xml from build.sh, and nothing else) to Codecov, with the
      # CODECOV_TOKEN secret (Dependabot's pull requests read the Dependabot secret of that name). A failed
      # or stalled upload, as during an outage of Codecov, does not fail the build (continue-on-error), while
      # fail_ci_if_error keeps the action from running an upload tool whose signature does not verify.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        timeout-minutes: 5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
  # Packs the viewer without write access; deploy only publishes the artifact. Only a push to main that
  # built and checked cleanly publishes; forks have no Pages of this repository to deploy to.
  pages-pack:
    name: pack the viewer
    needs: build
    if: github.repository == 'saschagrunert/avionics-panel' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: viewer
  pages-deploy:
    name: deploy to Pages
    needs: pages-pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # one deployment at a time; one that started finishes, a newer one waits
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read # read the tip of main
      pages: write # publish the artifact
      id-token: write # prove the deployment's origin to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Builds of two quick pushes run in parallel and the concurrency group only serialises the deploys,
      # not their order: a build that finishes late must not replace a newer viewer. Only the commit that
      # is still the tip of main deploys (an amended main drops the old commit altogether).
      - id: tip
        name: still the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::main moved on to $tip: skipping the deploy of $GITHUB_SHA"
          fi
      - id: deployment
        if: steps.tip.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
