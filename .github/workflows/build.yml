name: build
# Regenerates every output with ./build.sh, which runs all checks (electrical, DRC, pin order, fit
# clearances, firmware tests), then makes sure the committed board files and the button map are current.
# The weekly run catches a nixpkgs update that changes a generator's result.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
# Pull requests cancel their outdated runs. Every push to main gets a group of its own: GitHub replaces
# the pending run of a group when a newer one queues, which would leave that commit unchecked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  build:
    name: build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      actions: write # the cache step deletes superseded caches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - id: nixpkgs
        name: nixpkgs revision (cache key)
        run: echo "rev=$(curl -sfL https://channels.nixos.org/nixpkgs-unstable/git-revision)" >>"$GITHUB_OUTPUT"
      # Only main saves the Nix store, which pull requests restore: one cache per pull request would push
      # the ones of main out of the repository's 10 GB.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-build-${{ steps.nixpkgs.outputs.rev }}
          restore-prefixes-first-match: nix-build-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 4G
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-build-
          purge-created: 0
          purge-primary-key: never
      - run: ./build.sh
      - name: Committed outputs are up to date
        run: |
          git diff --exit-code -- \
            production/avionics-panel-rev1-gerbers.zip \
            production/avionics-panel-rev1-BOM.csv \
            production/avionics-panel-rev1-CPL.csv \
            production/avionics-panel-rev1-THT-LCSC.csv \
            firmware/BUTTONS.md \
            viewer/geometry.js
      # STEP, STL and PNG files depend on the OpenCascade and matplotlib versions, so a change there is
      # listed, not an error.
      - name: Other changed outputs
        run: git status --short
