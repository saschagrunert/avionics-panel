name: build
# Runs ./build.sh, which regenerates every output and runs every check, and fails when a committed output is
# not current. Builds the simulator for Windows and the MobiFlight profiles, runs the simulator's Windows
# tests and runs the zip on Windows. A push to main publishes the 3D view once build.sh and its checks pass.
# Once the Windows jobs and both files' jobs pass too, it replaces the files of the latest build (the release
# on the tag rolling), at the links the docs give; a release that is published gets the same files attached.
# build.sh takes its tools from the nixpkgs locked in flake.lock; the zip and the profiles are made with the
# runner's python3.
on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
# Pull requests cancel their outdated runs. Every other run (a push to main, a release, a manual run) is a
# group of its own, so none replaces another pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  build:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      actions: write # the cache step deletes superseded caches, on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # build.sh puts the locked nixpkgs on NIX_PATH itself
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # The Nix store, keyed on flake.lock and nix/*.nix. A new key restores the latest store and adds what is
      # missing. Only main saves, and purges the caches of earlier keys; pull requests restore. zizmor's
      # cache-poisoning audit flags this step for the release trigger. The ignore is for this step alone, on a
      # line of its own so that the version stays a comment of its own: this job publishes nothing, the files
      # come from the zip and profiles jobs, which restore no cache, and are fetched by their artifacts' names.
      - uses: # zizmor: ignore[cache-poisoning]
          nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-build-${{ hashFiles('flake.lock', 'nix/*.nix') }}
          restore-prefixes-first-match: nix-build-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 4G
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-build-
          purge-created: 0
          purge-primary-key: never
      # tests/test_uhid.py needs /dev/uhid and the hidraw node of each device it makes. If the uhid module is
      # missing, this installs the extra modules package of the runner's kernel. Where the module loads, the
      # tests must run (REQUIRE_UHID); for a kernel without it they skip, with a warning.
      - id: uhid
        name: uhid for the kernel HID tests
        run: |
          if sudo modprobe uhid || {
            sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" &&
              sudo modprobe uhid
          }; then
            echo 'KERNEL=="hidraw*", MODE="0666"' | sudo tee /etc/udev/rules.d/99-hidraw.rules
            sudo udevadm control --reload
            sudo chmod a+rw /dev/uhid
            sudo udevadm settle
            echo "require=1" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::no uhid module for the kernel $(uname -r): tests/test_uhid.py skips"
          fi
      - run: ./build.sh
        env:
          REQUIRE_UHID: ${{ steps.uhid.outputs.require }}
      # build.sh reproduces every file: a changed, new or deleted output fails. On a Dependabot pull request
      # the nixpkgs update can change outputs (the solids and meshes, viewer/geometry.js and the fits table
      # of mechanics.md follow OpenCascade; drawings, pictures and lettering follow matplotlib, shapely and
      # librsvg): run build.sh on its branch and commit the result.
      - name: Committed outputs are up to date
        run: |
          git status --short
          if [ -n "$(git status --porcelain)" ]; then
            git diff --stat
            echo "::error::build.sh changed, added or removed outputs: run it and commit the result"
            exit 1
          fi
      # The firmware tests' coverage (coverage.xml from build.sh, and nothing else) goes to Codecov, with the
      # CODECOV_TOKEN secret (Dependabot's pull requests read the Dependabot secret of that name). A failed or
      # stalled upload does not fail the build (continue-on-error), while fail_ci_if_error keeps the action
      # from running an upload tool whose signature does not verify.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        timeout-minutes: 5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
  # The simulator for Windows (windows/make_zip.py: Python's embeddable package, pinned by its hash, with the
  # firmware, the simulator and the viewer), built on Linux and kept as an artifact of the run. A pull request's
  # zip and profiles are built from its head, not the merge GitHub makes for the run: the commit they name is one
  # that exists.
  zip:
    name: simulator zip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 windows/make_zip.py --out avionics-panel-sim-windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avionics-panel-sim-windows
          path: avionics-panel-sim-windows.zip
          if-no-files-found: error
          # the release keeps its own copy; a run's zip is only for trying a change
          retention-days: 7
  # The profile of every avionics family and aircraft in mobiflight/families/ and a zip with a project of every
  # avionics part, bound to no joysticks: MobiFlight asks for both when it opens one
  # (docs/using/mapping.md#generated-profiles); a zip with the quick-reference card of every profile, and
  # MobiFlight's joystick definition of the panel. Each project's name ends in the commit's date and short hash:
  # git archive fills in firmware/version.py, as in a release's source code and the zip.
  profiles:
    name: MobiFlight profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          git -c core.abbrev=7 archive HEAD firmware/version.py | tar -x
          families=$(python3 -c "from mobiflight.families import FAMILIES; print(*FAMILIES)")
          for family in $families; do
            python3 -m mobiflight --family "$family" -o "avionics-panel-$family.mfproj"
          done
          python3 -m mobiflight --parts-zip avionics-panel-parts.zip
          python3 -m mobiflight --cards avionics-panel-cards.zip
          python3 -m mobiflight --joystick-definition avionics-panel.joystick.json
          grep -q '"Name": "Avionics Panel: .* ([0-9-]*, [0-9a-f]\{7\})"' avionics-panel-g1000.mfproj
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avionics-panel-mobiflight
          path: |
            avionics-panel-*.mfproj
            avionics-panel-parts.zip
            avionics-panel-cards.zip
            avionics-panel.joystick.json
          if-no-files-found: error
          retention-days: 7
  # The simulator's Windows code on Windows: the vJoy and keystroke outputs, against stand-ins for the DLLs, the
  # page's server and the zip's build, on the zip's minor version of Python (tests/test_windows_zip.py compares
  # the two). -rs lists what skips, with the reason.
  windows:
    name: Windows tests
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install pytest==9.1.1
      - run: >-
          python -m pytest -v -rs
          tests/test_page.py tests/test_sendinput.py tests/test_vjoy.py tests/test_windows_zip.py
        env:
          REQUIRE_ZIP_PYTHON: "1"
  # The zip of this run as it is published, unpacked on Windows: the Python it ships with imports the simulator
  # and runs the firmware, then serves the page (vJoy is not installed here). profile.bat says how to use it and
  # writes a profile, named with the zip's commit. firewall.bat runs as the runner's administrator and leaves its
  # one rule for the zip's python.exe.
  windows-zip:
    name: simulator zip on Windows
    needs: zip
    runs-on: windows-2025
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avionics-panel-sim-windows
      - run: Expand-Archive avionics-panel-sim-windows.zip .
      - run: >-
          & .\avionics-panel-sim\python\python.exe -c "import sim.page, sim.sendinput, sim.vjoy; from sim import Sim;
          sim.page.inputs(); s = Sim(); s.tap('AP'); assert s.presses(1) == ['AP'], s.presses(1)"
      - run: |
          $page = Start-Process .\avionics-panel-sim\python\python.exe "-m sim.page --port 8765" -NoNewWindow -PassThru
          try {
            for ($i = 0; ; $i++) {
              try { $r = Invoke-WebRequest "http://127.0.0.1:8765/?sim" -TimeoutSec 5; break }
              catch { if ($i -ge 30) { throw }; Start-Sleep 1 }
            }
            if (-not $r.Content.Contains("sim.js")) { throw "not the panel page" }
            # the program says hello on the page's stream, and still runs
            & .\avionics-panel-sim\python\python.exe -c "import urllib.request as u; r = u.urlopen('http://127.0.0.1:8765/sim/events', timeout=10); assert b'event: hello\n' in [r.readline() for _ in range(3)]"
            if ($LASTEXITCODE) { throw "no hello" }
            if ($page.HasExited) { throw "the simulator ended" }
          } finally {
            Stop-Process -Id $page.Id
          }
      - run: |
          $usage = "" | cmd /c .\avionics-panel-sim\profile.bat
          if ($LASTEXITCODE) { throw "profile.bat without arguments failed" }
          if (-not ($usage -match "^--family: .*\bg1000\b")) { throw "no list of the profiles: $usage" }
          cmd /c .\avionics-panel-sim\profile.bat --family g1000 -o x.mfproj
          if ($LASTEXITCODE) { throw "profile.bat failed" }
          if (-not (Test-Path x.mfproj)) { throw "profile.bat wrote no x.mfproj" }
          $name = (Get-Content x.mfproj -Raw | ConvertFrom-Json).Name
          if ($name -notmatch "^Avionics Panel: G1000 NXi \(\d{4}-\d\d-\d\d, [0-9a-f]{7,}\)$") { throw "named $name" }
          # a second download unpacks into a folder of spaces and parentheses: profile.bat runs from there too
          Copy-Item -Recurse .\avionics-panel-sim "zip (1) x"
          & ".\zip (1) x\profile.bat" --family gns -o y.mfproj
          if ($LASTEXITCODE -or -not (Test-Path y.mfproj)) { throw "profile.bat failed in a folder of spaces" }
      - run: |
          $python = (Resolve-Path .\avionics-panel-sim\python\python.exe).Path
          # Windows' own rule can hold the path in another case: the delete must match it all the same
          New-NetFirewallRule -DisplayName "blocked when Windows asked" -Direction Inbound -Action Block -Program $python.ToLower() | Out-Null
          "" | cmd /c .\avionics-panel-sim\firewall.bat
          if ($LASTEXITCODE) { throw "firewall.bat failed" }
          $filters = @(Get-NetFirewallApplicationFilter | Where-Object Program -eq $python)
          if ($filters.Count -ne 1) { throw "$($filters.Count) rules for python.exe, not 1" }
          $rule = $filters[0] | Get-NetFirewallRule
          if ($rule.DisplayName -ne "Avionics Panel simulator" -or $rule.Action -ne "Allow" -or $rule.Profile -ne "Private") {
            throw "not the rule: $($rule | Out-String)"
          }
          $remote = ($rule | Get-NetFirewallAddressFilter).RemoteAddress
          if ($remote -ne "LocalSubnet") { throw "the rule lets in $remote, not the local subnet" }
  # Packs the viewer without write access; pages-deploy publishes the artifact. A push to main or a manual run
  # on main publishes, once its build has passed; forks have no Pages of this repository to deploy to.
  pages-pack:
    name: pack the viewer
    needs: build
    if: github.repository == 'saschagrunert/avionics-panel' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the quick-reference cards beside the view, at cards/ (docs/using/mapping.md#quick-reference-cards), with
      # the commit in their titles as the release's
      - run: |
          git -c core.abbrev=7 archive HEAD firmware/version.py | tar -x
          python3 -m mobiflight --cards cards.zip
          python3 -m zipfile -e cards.zip viewer/cards
          test -f viewer/cards/avionics-panel-g1000-card.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: viewer
  pages-deploy:
    name: deploy to Pages
    needs: pages-pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One deployment at a time: one that started finishes, and every other one waits its turn (queue: max), so
    # the next one to queue, which can be an older commit's, cancels none of them: the tip's always runs.
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # read the tip of main
      pages: write # publish the artifact
      id-token: write # prove the deployment's origin to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Builds of two quick pushes run in parallel and the concurrency group only serialises the deploys,
      # not their order: a build that finishes late must not replace a newer viewer. Only the commit that
      # is still the tip of main deploys (an amended main drops the old commit altogether).
      - id: tip
        name: still the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::main moved on to $tip: skipping the deploy of $GITHUB_SHA"
          fi
      - id: deployment
        if: steps.tip.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  # Only this job and rolling may write to the releases, this one only to the release that started the run. Both
  # wait for the build, the Windows tests, the files and the zip's run on Windows.
  release:
    name: attach to the release
    needs: [build, windows, zip, windows-zip, profiles]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # upload a release asset
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avionics-panel-sim-windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avionics-panel-mobiflight
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" avionics-panel-sim-windows.zip avionics-panel-*.mfproj avionics-panel-parts.zip \
            avionics-panel-cards.zip avionics-panel.joystick.json --repo "$GITHUB_REPOSITORY" --clobber
  # Keeps the files of the newest commit on main that passed at releases/download/rolling/<file>. The first run
  # makes the release "Latest build" and its tag rolling; each run replaces the files, then moves the tag to its
  # commit, so the tag, and the release's source code, name the commit the files were built from. Needs immutable
  # releases off. Updates run one at a time, and every one waits its turn (queue: max), so the next one to queue,
  # which can be an older commit's, cancels none of them: the tip's always runs, and only it replaces the files. A
  # re-run repairs a failed update.
  rolling:
    name: update the latest build
    needs: [build, windows, zip, windows-zip, profiles]
    if: github.repository == 'saschagrunert/avionics-panel' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: rolling-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # replace the files, move the tag, edit the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avionics-panel-sim-windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avionics-panel-mobiflight
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tip=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on to $tip: leaving the latest build as it is"
            exit 0
          fi
          docs=$GITHUB_SERVER_URL/$GH_REPO/blob/main/docs/using
          notes="Built from main: each push to main replaces the files and moves the tag to its commit, so the tag"
          notes+=" and the source code here are the commit the files were built from."
          notes+=" [Simulator]($docs/simulator.md) and [Mapping]($docs/mapping.md#generated-profiles) have the steps."
          gh release view rolling >/dev/null 2>&1 ||
            gh release create rolling --latest --target "$GITHUB_SHA" --title "Latest build" --notes "$notes"
          # every file to download, built in this workflow, goes up in this one call, under its own name
          names=(avionics-panel-sim-windows.zip avionics-panel-*.mfproj avionics-panel-parts.zip avionics-panel-cards.zip
            avionics-panel.joystick.json)
          gh release upload rolling --clobber "${names[@]}"
          # then a file this run did not build goes, such as a profile that was removed (the names are
          # letters, digits, dots and hyphens, which GitHub keeps as they are)
          assets=$(gh release view rolling --json assets --jq '.assets[].name')
          while IFS= read -r name; do
            [[ -z $name || " ${names[*]} " == *" $name "* ]] || gh release delete-asset rolling "$name" --yes </dev/null
          done <<<"$assets"
          # the tag goes last, once every file is up, so it never names a commit whose files are not all there (a
          # failed upload leaves it on the commit before, and a re-run repairs it), and only while this commit is
          # still the tip; a ref this token moves starts no workflow
          tip=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on to $tip during the upload: its run moves the tag"
            exit 0
          fi
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/rolling" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit rolling --title "Latest build" --prerelease=false --latest --target "$GITHUB_SHA" \
            --notes "$notes" >/dev/null
