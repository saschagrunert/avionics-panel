name: build

# Regenerates every output with ./build.sh, which runs all checks (electrical, DRC, pin order, fit
# clearances, firmware tests), then makes sure the committed board files and button map are current.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: ./build.sh
      - name: Committed outputs are up to date
        run: |
          git diff --exit-code -- \
            production/avionics-panel-rev1-gerbers.zip \
            production/avionics-panel-rev1-BOM.csv \
            production/avionics-panel-rev1-CPL.csv \
            production/avionics-panel-rev1-THT-LCSC.csv \
            firmware/BUTTONS.md
      - name: Other changed outputs (tool versions may differ, not an error)
        run: git status --short
