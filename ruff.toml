# Python lint for every Python file of the repository (`ruff check .`, in CI), for Python 3.10, the oldest the
# simulator runs on (docs/using/simulator.md).
line-length = 120
target-version = "py310"

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E702",   # short geometry statements share a line on purpose (seg(...); via(...))
    "C408",   # dict(key=value) reads better for the stack and part tables
]

[lint.per-file-ignores]
# CircuitPython: no zip(strict=) and no contextlib (SIM105), and any() or next() over a generator would allocate
# in every loop pass (SIM110); keep the code to what the firmware runtime supports
"firmware/*" = ["B905", "UP", "SIM105", "SIM110"]
