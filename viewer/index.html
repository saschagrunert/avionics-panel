<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avionics Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%2327282b'/><circle cx='8' cy='8' r='3.5' fill='%23d9a441'/></svg>">
<style>
  /* the cap font is served with the page (fonts/, SIL OFL), nothing loads from a font CDN */
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 600; src: url(fonts/BarlowSemiCondensed-SemiBold.ttf) format("truetype"); }
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 700; src: url(fonts/BarlowSemiCondensed-Bold.ttf) format("truetype"); }
  /* layout: full-bleed 3D canvas; name and dimensions top-left, view switcher bottom-centre */
  :root {
    --bg: #e3e5e9; --fg: #1c1e22; --muted: #5c6169;
    --panel: rgba(255,255,255,.88); --panel-fg: #1c1e22; --on: #1c1e22; --on-fg: #ffffff;
    --accent: #c9952f;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #34373d; --fg: #e7e8eb; --muted: #a4aab3;
      --panel: rgba(32,34,39,.9); --panel-fg: #e7e8eb; --on: #e7e8eb; --on-fg: #16181c;
      --accent: #d9a441; color-scheme: dark;
    }
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }
  .hdr { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px));
         left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
         pointer-events: none; display: flex; flex-direction: column; gap: 3px; }
  .hdr b { font-size: 17px; font-weight: 600; letter-spacing: .01em; text-wrap: balance; }
  .hdr span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { position: fixed; left: 50%; transform: translateX(-50%);
         bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px;
         background: var(--panel); padding: 5px; border-radius: 12px;
         box-shadow: 0 2px 14px rgba(0,0,0,.18); backdrop-filter: blur(8px); }
  .bar button { border: 0; background: transparent; padding: 8px 13px; border-radius: 9px;
                font: 500 14px var(--font); color: var(--panel-fg); cursor: pointer; }
  .bar button.on { background: var(--on); color: var(--on-fg); }
  .bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .legend { position: fixed; right: max(16px, env(safe-area-inset-right, 0px));
            bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font: 12px var(--mono);
            color: var(--muted); pointer-events: none; text-align: right; line-height: 1.5; }
  body.clean .hdr, body.clean .bar, body.clean .legend { display: none; }
  .fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
          color: var(--muted); background: var(--bg); }
  .touch { display: none; }
  /* the legend fits beside the centred view buttons only in a wide window */
  @media (max-width: 1170px) { .legend { display: none; } }
  /* a touch screen gets its own hint; there and in a narrow window the buttons are at least 44 px high */
  @media (pointer: coarse) { .mouse { display: none; } .touch { display: inline; } }
  @media (pointer: coarse), (max-width: 560px) { .bar button { min-height: 44px; padding: 8px 12px; } }
  /* the five buttons fit a 320 px window */
  @media (max-width: 380px) { .bar button { padding: 8px; } }
  /* a short window has no room for the lines under the name: they would lie over the model */
  @media (max-height: 480px) { .hdr span { display: none; } }
</style>
<canvas id="c"></canvas>
<div class="hdr">
  <b>Avionics Panel</b>
  <span id="dims"></span>
  <span class="mouse">drag to rotate · scroll to zoom · right-drag to pan</span>
  <span class="touch">drag to rotate · pinch to zoom · drag with two fingers to pan</span>
</div>
<div class="bar" role="group" aria-label="View">
  <button id="vA" class="on" type="button" aria-pressed="true">Seated</button>
  <button id="vE" type="button" aria-pressed="false">Exploded</button>
  <button id="vT" type="button" aria-pressed="false">Top</button>
  <button id="vF" type="button" aria-pressed="false">Front</button>
  <button id="vB" type="button" aria-pressed="false">Bottom</button>
</div>
<div class="legend"></div>
<!-- three.js r128 (MIT, vendor/three-LICENSE) is served with the page: no request leaves the site -->
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="geometry.js"></script>
<script>
// ---------------- design data (mm; PCB coordinates: x to the right, y from the back edge towards the user) ----------------
// Every dimension of the panel comes from geometry.js, which mech/make_viewer_data.py writes from pcb/board.py,
// mech/stack.py and mech/make_mech.py: the parts, the plate artwork and the cap legends. Colours, textures and
// views live here, and two drawing aids: SKIN, which keeps faces apart that would lie in one plane, and SHARP,
// the corner radius of a square corner.
// Any failure until the first frame is drawn (a missing file, a geometry.js that does not match this page, no
// WebGL) shows a message in place of the page UI, not a blank page.
function fail(text = 'The 3D view could not load: geometry.js or three.js is missing or does not match this page.') {
  if (document.querySelector('.fail')) return;
  const d = document.createElement('div'); d.className = 'fail'; d.setAttribute('role', 'alert'); d.textContent = text;
  document.body.appendChild(d); document.body.classList.add('clean');
}
const onError = () => fail();
window.addEventListener('error', onError);
if (!window.GEOMETRY || !window.THREE || !THREE.OrbitControls) throw new Error('geometry.js or three.js missing');
// reading a key that geometry.js does not have throws, with the key's path: a file that does not match this page
// shows the message, and the console says what is missing
const strict = (o, path = '') => new Proxy(o, { get(t, k) {
  if (typeof k === 'symbol') return t[k];
  if (!(k in t)) throw new Error(`geometry.js has no ${path}${k}`);
  return t[k] && typeof t[k] === 'object' ? strict(t[k], `${path}${k}.`) : t[k];
} });
const G = strict(window.GEOMETRY);
// the flip-flop icon of COM ⇆ / ADF ⇆ (stack.py): polygons in em from the icon's left edge and the text middle
const FLIP = G.flip_icon;
function flipIcon(g, ix, y, em, polys = FLIP.polys, grow = 0) {   // grow: outline width (px) all round
  for (const poly of polys) {
    g.beginPath();
    poly.forEach(([x, py], i) => (i ? g.lineTo : g.moveTo).call(g, ix + x * em, y + py * em));
    g.closePath(); g.fill();
    if (grow > 0) { g.lineWidth = 2 * grow; g.lineJoin = 'round'; g.stroke(); }
  }
}
const W = G.board.w, H = G.board.h, R = G.board.corner_r, CLEAR = G.body.clear, O = G.body.overhang;
const WO = W + 2 * O, HO = H + 2 * O, RO = R + O;
const PLATE_Z0 = G.plate.z0, PLATE_Z1 = G.plate.z1, Z_BOT = G.body.z_bot, Z_FLOOR = G.body.z_floor, PCB_T = G.board.t;
const TILT = G.body.tilt_deg * Math.PI / 180, SLOPE = Math.tan(TILT);
const COLS = G.keys.cols, ROWS = G.keys.rows;
const CAP = G.keys.cap, HOLE = G.plate.key_hole;   // [w, h, corner r]
// [label, shift] per key, from mech/stack.py; UP / DN auto-repeat while held (100 ft/min or 1 kt per step).
// Autopilot columns: engage / vertical / lateral; VS and FLC sit next to UP and DN as on the G1000.
const KEYS = G.key_legends;
const KNOB_IN = G.inner_knob.d / 2;
const at = (name, extra) => {   // position, size and legends from mech/stack.py via geometry.js
  const k = G.knobs[name];
  return { name, x: k.x, y: k.y, r: k.flutes ? G.outer_knob.d / 2 : 0, flutes: k.flutes && G.flutes[k.flutes], legendTilt: k.legend_tilt,
           main: k.legend, shift: k.legend_shift, ...extra };
};
const KNOBS = {
  // legends sit on the near side of each knob (the far side is hidden behind the knob when seated)
  ap:    at('ALTHDG', { kind: 'dual' }),  // outer ALT, inner HDG (push SYNC); shifted outer BARO, inner CRS (push STD), the G1000's order.
  range: at('RANGE',  { kind: 'range' }),
  radio: at('FREQ',   { kind: 'dual' }),
  fms:   at('FMS',    { kind: 'dual' }) };   // shifted: cockpit lighting
// lights: SHIFT (amber) is on while SHIFT applies (pulsing in its last second), UNIT 2 (white) while unit 2 is selected
const light = name => ({ name, x: G.lights[name].x, y: G.lights[name].y, r: G.lights[name].d / 2 });
const LIGHTS = [
  { ...light('SHIFT'), color: 0x20180a, emissive: G.amber, on: 1.0 },     // shown armed, same amber as the legends
  { ...light('UNIT'), color: 0x8c8f94, emissive: 0xffffff, on: 0.0 } ];   // shown off
// one laser-marked frame around all keys, split by single lines (no double rule between groups).
// Rows stay aligned across the panel on purpose; the wider gap between rows 2 and 3 holds the FMS line.
const ART = G.plate_art, FRAME = ART.frame;
const MOUNTS = G.board.mounts, SUPPORTS = G.body.supports;
const SCREW_HEAD_Z = G.screw.head_z, SCREW_L = G.screw.length, PIPE_Z0 = G.pipe.z0;
const USB_X = G.parts.usb_x;
const SKIN = 0.02, SHARP = 0.001;
const CAP_FONT = '"Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", sans-serif';
const AMBER = G.amber, WHITE_ENGR = 'rgba(228,230,234,0.92)', PLATE_BASE = '#2d2f33';

const backH = PLATE_Z1 - Z_BOT + SLOPE * HO;
document.getElementById('dims').textContent =
  `${WO.toFixed(0)} × ${HO.toFixed(0)} mm · ${(PLATE_Z1 - Z_BOT).toFixed(0)} mm at the front, ${backH.toFixed(0)} mm at the back · ` +
  `caps ${(G.keys.cap_base + G.keys.cap_height - PLATE_Z1).toFixed(1)} mm proud`;
document.querySelector('.legend').innerHTML =
  `anodised aluminium plate · MJF nylon wedge body, ${G.body.tilt_deg}°<br>` +
  `${KEYS.flat().length} keys · ${Object.values(KNOBS).filter(k => k.kind === 'dual').length} dual knobs · range/pan`;

// a seeded generator for the bead-blasted grain, so the same view always renders the same pixels: mulberry32,
// exact 32-bit integer steps (Math.imul). A float LCG loses bits in the product and repeats after about 10k
// values, which the plate's ~2000 px rows show as diagonal streaks
let grainSeed = 7;
const grain = () => {
  grainSeed = (grainSeed + 0x6D2B79F5) | 0;
  let t = Math.imul(grainSeed ^ (grainSeed >>> 15), 1 | grainSeed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

async function main() {
  const canvas = document.getElementById('c');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
  catch (e) { fail('This view needs WebGL. Open the page in a current desktop or mobile browser.'); return; }
  // the legends are drawn into textures, so wait (briefly) for the condensed face
  try {
    await Promise.race([Promise.all(['600', '700'].map(w => document.fonts.load(`${w} 40px "Barlow Semi Condensed"`))),
                        new Promise(r => setTimeout(r, 2500))]);
  } catch (e) { /* fall back to the stack */ }

  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 1, 3000);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI / 2 - 0.03;
  controls.minDistance = 60;                     // close enough to fill the window with one group of keys

  scene.add(new THREE.HemisphereLight(0xffffff, 0x6d727a, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(-110, 230, 170);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = sun.shadow.camera.bottom = -150;
  sun.shadow.camera.right = sun.shadow.camera.top = 150;
  sun.shadow.camera.near = 10; sun.shadow.camera.far = 700;
  sun.shadow.bias = -0.0004;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.32); fill.position.set(190, 90, -140); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.22); rim.position.set(20, 60, -260); scene.add(rim);
  const front = new THREE.DirectionalLight(0xffffff, 0.25); front.position.set(0, 40, 300); scene.add(front);

  const groundMat = new THREE.ShadowMaterial({ opacity: 0.25 });   // only the shadow: no disc edge, no colour mismatch
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  // ---------------- helpers ----------------
  const px = x => x - W / 2, pz = y => y - H / 2;
  function rrectShape(w, h, r, cx = 0, cy = 0) {
    const s = new THREE.Shape(), x = cx - w / 2, y = cy - h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  function rrectPath(w, h, r, cx = 0, cy = 0) { const p = new THREE.Path(); p.curves = rrectShape(w, h, r, cx, cy).curves; return p; }
  function circlePath(cx, cy, r) { const p = new THREE.Path(); p.absarc(cx, cy, r, 0, Math.PI * 2, true); return p; }
  // What is left of a plan polygon ([x, y] points) when a disc is cut out of it, as polygons: the polygon itself
  // if the circle does not cross its outline. Else the walk along the outline turns onto the circle where the
  // outline goes into the disc, and leaves it at the next point round the circle where the outline comes out.
  function less(pts, cx, cy, r) {
    const nodes = [];                                    // the outline outside the disc: points, and crossings
    let area = 0;                                        // [x, y, angle on the circle, -1 going in or 1 coming out]
    pts.forEach(([x0, y0], i) => {
      const [x1, y1] = pts[(i + 1) % pts.length], dx = x1 - x0, dy = y1 - y0, fx = x0 - cx, fy = y0 - cy;
      const a = dx * dx + dy * dy, b = fx * dx + fy * dy, c = fx * fx + fy * fy - r * r, d = b * b - a * c;
      area += x0 * y1 - x1 * y0;
      if (c > 0) nodes.push([x0, y0]);
      if (d > 0) for (const s of [-1, 1]) {
        const t = (-b + s * Math.sqrt(d)) / a;
        if (t > 0 && t < 1) nodes.push([x0 + t * dx, y0 + t * dy, Math.atan2(fy + t * dy, fx + t * dx), s]);
      }
    });
    const outs = nodes.filter(n => n[3] > 0), turn = area > 0 ? -1 : 1, loops = [];
    if (!outs.length || outs.length !== nodes.filter(n => n[3] < 0).length) return nodes.length ? [pts] : [];
    for (const start of outs) if (!start.done) {
      const loop = [];
      for (let n = start; !n.done;) {
        n.done = true;
        let k = nodes.indexOf(n);
        do { loop.push(nodes[k].slice(0, 2)); k = (k + 1) % nodes.length; } while (!(nodes[k][3] < 0));
        const a0 = nodes[k][2], span = e => ((turn * (e[2] - a0)) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        n = outs.reduce((m, e) => span(e) < span(m) ? e : m);
        for (let a = 0; a < span(n); a += Math.PI / 24) loop.push([cx + r * Math.cos(a0 + turn * a), cy + r * Math.sin(a0 + turn * a)]);
      }
      loops.push(loop);
    }
    return loops;
  }
  const inside = (pts, x, y) => pts.reduce((c, [x0, y0], i) => {   // is the point inside the polygon
    const [x1, y1] = pts[(i + 1) % pts.length];
    return (y0 > y) !== (y1 > y) && x < x0 + (x1 - x0) * (y - y0) / (y1 - y0) ? !c : c;
  }, false);
  function slab(shape, z0, z1, mat, extra = {}) {
    const g = new THREE.ExtrudeGeometry(shape, Object.assign({ depth: z1 - z0, bevelEnabled: false, curveSegments: 16 }, extra));
    g.rotateX(-Math.PI / 2); g.translate(0, z0, 0);
    const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; return m;
  }
  // the bottom face of a part that carries a texture on top gets a material of its own, materials[index]: an
  // extrusion's first material is on both end faces, the bottom one first
  function plainBottom(geo, index) {
    const ends = geo.groups[0];
    ends.count /= 2; geo.addGroup(ends.start, ends.count, index); ends.start += ends.count;
  }
  function shearBottom(mesh, z0) {                       // a slab's bottom, at z0, goes down to the desk plane
    const p = mesh.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) if (Math.abs(p.getY(i) - z0) < 1e-4) p.setY(i, Z_BOT - SLOPE * (HO / 2 - p.getZ(i)));
    p.needsUpdate = true; mesh.geometry.computeVertexNormals();
  }
  // the canvases are painted edge to edge, so their textures go to the GPU without the alpha channel: a canvas
  // texel that a browser leaves partly transparent would show the page through the part
  function texture(c) {
    const t = new THREE.CanvasTexture(c);
    t.format = THREE.RGBFormat; t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    return t;
  }
  function mmTexture(c, wmm, hmm) {
    const t = texture(c);
    t.repeat.set(1 / wmm, 1 / hmm); t.offset.set(0.5, 0.5);
    return t;
  }
  function box(group, w, h, d, x, y, z0, mat) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(px(x), z0 + h / 2, pz(y)); m.castShadow = true; group.add(m); return m;
  }
  const keyList = [];
  KEYS.forEach((row, r) => row.forEach((k, c) => { if (k) keyList.push({ x: COLS[c], y: ROWS[r], label: k[0], shift: k[1] }); }));

  // The plate's letters as mech/make_plate_art.py sets them: a space is ART.text.space em wide, and the middle of a
  // glyph's capitals, ART.text.mid em over its baseline, lies on the legend's line.
  const advance = (g, ch, em) => ch === ' ' ? ART.text.space * em : g.measureText(ch).width;
  // one legend in one font along a circle, centred on angle `mid` (0 = towards +x, y towards the user). The
  // letters face outward on the far half and inward on the near half; the side is chosen once per legend,
  // by its centre, so the ends of a long legend can lean past sideways (accepted: every legend reads in one piece).
  function arcText(g, text, type, cx, cy, r, mid, color, track) {
    const near = Math.sin(mid) > 0.01;
    g.save(); g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.font = type.font;
    const chars = [...text];
    const ws = chars.map(ch => advance(g, ch, type.em) + track);
    const total = ws.reduce((a, b) => a + b, 0) - track;
    let acc = 0;
    chars.forEach((ch, i) => {
      const off = (acc + (ws[i] - track) / 2 - total / 2) / r;
      const a = near ? mid - off : mid + off;
      g.save(); g.translate(cx + r * Math.cos(a), cy + r * Math.sin(a));
      g.rotate(near ? a - Math.PI / 2 : a + Math.PI / 2); g.fillText(ch, 0, ART.text.mid * type.em); g.restore();
      acc += ws[i];
    });
    g.restore();
  }

  const assembly = new THREE.Group();
  assembly.rotation.x = TILT;
  scene.add(assembly);

  // ---------------- materials (sRGB colours converted to linear for the sRGB output) ----------------
  const M = (o) => { const m = new THREE.MeshStandardMaterial(o); m.color.convertSRGBToLinear(); return m; };
  const bodyMat   = M({ color: 0x27282b, roughness: 0.93 });
  const plateSide = M({ color: 0x3a3c41, roughness: 0.8, metalness: 0.3 });     // bead blasted, anodised
  const capMat    = M({ color: 0x1b1c1f, roughness: 0.5 });
  const dark      = M({ color: 0x15161a, roughness: 0.6 });
  const metal     = M({ color: 0xb9bcc2, roughness: 0.35, metalness: 0.9 });
  const pcbSide   = M({ color: 0x3b382e, roughness: 0.7 });                   // FR4 edge between the black mask

  // ---------------- body: walls, floor, hollow wedge with ribs and foot pads (mech/make_mech.py) ----------------
  const bodyG = new THREE.Group(); assembly.add(bodyG);
  {
    const BD = G.body, CW = W + 2 * CLEAR, CH = H + 2 * CLEAR;
    // The holes, in plan (shape y = -pz: the back on top). From below: the screws' counterbores, up to their seats,
    // and the hole over the BOOT pads, through the floor. Above the seats: the screw holes.
    const hole = r => ([x, y]) => [px(x), -pz(y), r];
    const bores = [...MOUNTS.map(hole(BD.counterbore_r)), hole(BD.boot_hole / 2)(BD.boot)];
    const screwHoles = MOUNTS.map(hole(BD.boss_hole_r));
    // a slab of the body from a plan shape, less the holes at its height: one that crosses the shape's outline is
    // cut out of it, one inside it stays a hole. A slab from Z_BOT stands on the desk plane
    const part = (shape, z0, z1) => {
      const outline = shape.getPoints(24).map(v => [v.x, v.y]), holes = z0 < BD.seat_z ? bores : screwHoles;
      for (const pts of holes.reduce((ps, h) => ps.flatMap(p => less(p, ...h)), [outline])) {
        const s = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
        for (const [x, y, r] of holes) if (inside(pts, x, y)) s.holes.push(circlePath(x, y, r));
        const m = slab(s, z0, z1, bodyMat); if (z0 === Z_BOT) shearBottom(m, z0); bodyG.add(m);
      }
    };
    // the walls as one outline that runs in through the USB-C slot in the back wall;
    // the slot is as wide as the plug opening and open to the top, for the plate's tongue
    const UO = BD.usb_open, uo0 = UO.z - UO.h / 2, NW = UO.w;
    const nl = px(USB_X) - NW / 2, nr = px(USB_X) + NW / 2;
    const ring = new THREE.Shape(), ow = WO / 2, oh = HO / 2, cw = CW / 2, ch = CH / 2, cr = R + CLEAR;
    const cavity = s => {                                // the cavity's outline, from the slot's left side round to its right
      s.lineTo(nl, ch);
      s.lineTo(-cw + cr, ch); s.quadraticCurveTo(-cw, ch, -cw, ch - cr);

    const em = LEG.em * k, cx = c.width / 2, cy = c.height / 2, grow = LEG.grow * k;
    g.font = `${LEG.weight} ${em}px ${CAP_FONT}`; g.fillStyle = color; g.strokeStyle = color; g.textBaseline = 'alphabetic';
    g.lineJoin = 'round'; g.lineWidth = 2 * grow;
    const capH = g.measureText('H').actualBoundingBoxAscent;   // capitals centred on the cap, as make_caps.py
    const text = (t, x, y) => { g.fillText(t, x, y + capH / 2); g.lineWidth = 2 * grow; g.strokeText(t, x, y + capH / 2); };
    if (label === 'D→') {                                // Garmin direct-to: a D with an arrow through it
      const dw = g.measureText('D').width, x0 = cx - (dw + DTO.w * em) / 2;
      g.textAlign = 'left'; text('D', x0, cy);
      const y = cy - DTO.dy * em, xe = x0 + dw + DTO.w * em, hw = LEG.line / 2 * em, xa = x0 - DTO.tail * em, xn = xe - DTO.neck * em;
      flipIcon(g, 0, 0, 1, [[[xa, y - hw], [xn, y - hw], [xn, y + hw], [xa, y + hw]],
                            [[xe, y], [xe - DTO.head * em, y - DTO.head_h * em], [xe - DTO.head * em, y + DTO.head_h * em]]], grow);
    } else if (label.endsWith('⇆')) {                    // flip-flop: text + two opposed arrows
      const t = label.slice(0, -1).trimEnd(), tw = g.measureText(t).width, x0 = cx - (tw + (FLIP.gap + FLIP.w) * em) / 2;
      g.textAlign = 'left'; text(t, x0, cy);
      flipIcon(g, x0 + tw + FLIP.gap * em, cy, em, LEG.flip_polys, grow);
    } else {
      g.textAlign = 'center'; text(label, cx, cy);
    }
    return texture(c);
  }
  for (const key of keyList) {
    const height = G.keys.cap_height, base = G.keys.cap_base;
    const geo = new THREE.ExtrudeGeometry(rrectShape(CAP_TOP[0], CAP_TOP[1], CAP[2] - CB), { depth: height - CB, bevelEnabled: true, bevelSize: CB, bevelThickness: CB, bevelSegments: 3, curveSegments: 8 });
    geo.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(geo, capMat); m.position.set(px(key.x), base, pz(key.y)); m.castShadow = true; capsG.add(m);
    const color = key.label === 'SHIFT' ? AMBER : '#f3f3f3';
    const bg = '#1b1c1f';
    const top = new THREE.Mesh(new THREE.PlaneGeometry(CAP_TOP[0], CAP_TOP[1]),
      // more matte than the cap round it: no glare over the legends from a low angle
      new THREE.MeshStandardMaterial({ map: capTexture(key.label, color, bg), roughness: 0.8 }));
    top.rotation.x = -Math.PI / 2; top.position.set(px(key.x), base + height + SKIN, pz(key.y)); capsG.add(top);
    key.meshes = [m, top];                                   // the cap's parts, for the panel page (sim.js)
    // tactile bars, found without looking, on the edge stack.CAP_BAR_EDGE gives
    const BAR = G.keys.bar, barEdge = BAR.edge[key.label];   // as printed (mech/make_caps.py)
    if (barEdge) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(BAR.w, BAR.proud, BAR.d), capMat);
      bar.position.set(px(key.x), base + height + BAR.proud / 2, pz(key.y) + barEdge * (CAP_TOP[1] / 2 - BAR.inset)); bar.castShadow = true; capsG.add(bar);
      key.meshes.push(bar);
    }
  }

  // ---------------- knobs ----------------
  // avionics-style knobs: matte black plastic, slight taper, fine vertical flutes, chamfered flat top.
  // Short outer ring, inner knob standing clearly above it (Garmin / Bendix-King proportions).
  // No index line: the encoders turn endlessly, a pointer would suggest an absolute position.
  const knobPlastic = M({ color: 0x151617, roughness: 0.6, metalness: 0.0 });
  const outerG = new THREE.Group(), innerG = new THREE.Group(); assembly.add(outerG, innerG);
  function knob(x, y, r, z0, h, F, grp) {   // F: flutes from mech/stack.py (count, depth, taper, top chamfer)
    const flutes = F.n, depth = F.depth, taper = F.taper, bv = F.cham;
    const s = new THREE.Shape(), N = flutes * 10;
    for (let i = 0; i <= N; i++) {
      const a = i / N * Math.PI * 2;
      const groove = Math.pow(Math.max(0, Math.cos(flutes * a)), 6);     // narrow grooves, wide lands
      const rr = r - depth * groove;
      i ? s.lineTo(rr * Math.cos(a), rr * Math.sin(a)) : s.moveTo(rr * Math.cos(a), rr * Math.sin(a));
    }
    const g = new THREE.ExtrudeGeometry(s, { depth: h - 2 * bv, bevelEnabled: true, bevelThickness: bv, bevelSize: bv, bevelOffset: -bv, bevelSegments: 3, curveSegments: 1 });
    g.rotateX(-Math.PI / 2);
    const p = g.attributes.position;                     // taper: narrower towards the top
    for (let i = 0; i < p.count; i++) {
      const t = (p.getY(i) + bv) / h, k = 1 - taper * t;
      p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k);
    }
    p.needsUpdate = true; g.computeVertexNormals();
    const m = new THREE.Mesh(g, knobPlastic);
    m.position.set(px(x), z0 + bv, pz(y)); m.castShadow = true; m.receiveShadow = true; grp.add(m);
    return m;
  }
  for (const k of Object.values(KNOBS)) {
    const R = k.r, OK = G.outer_knob, IK = G.inner_knob, RK = G.range_knob;
    if (k.kind === 'dual') {
      k.rings = {                                                                                // their parts, for sim.js
        outer: [knob(k.x, k.y, R, PLATE_Z1 + OK.z0, OK.z1 - OK.z0, k.flutes, outerG)],           // outer ring (FMS: coarser grip)
        inner: [knob(k.x, k.y, KNOB_IN, PLATE_Z1 + IK.z0, IK.z1 - IK.z0, G.flutes.inner, innerG)] };   // inner knob, on the shaft tip
    } else {                                                  // RANGE: turns, tilts to pan, pushes; skirt hides the tilt opening
      // the skirt as mech/make_knobs.py turns it: the flat hub, the dished underside up to the rim, the rim, a
      // 45 degree cone up into the fluted body. Each corner is there twice, so its two faces are shaded apart
      const sk = RK.skirt_d / 2, neck = RK.d / 2 - RK.sink, top = RK.dish + RK.rim + sk - neck;
      const prof = [[0, 0], [RK.hub_d / 2, 0], [sk, RK.dish], [sk, RK.dish + RK.rim], [neck, top], [0, top]];
      const skirt = new THREE.Mesh(new THREE.LatheGeometry(prof.flatMap(([r, z]) => [new THREE.Vector2(r, z), new THREE.Vector2(r, z)]), 64), knobPlastic);
      skirt.position.set(px(k.x), PLATE_Z1 + RK.z0, pz(k.y)); skirt.castShadow = true; outerG.add(skirt);
      k.rings = { ring: [skirt, knob(k.x, k.y, RK.d / 2, PLATE_Z1 + RK.z0 + RK.dish, RK.z1 - RK.z0 - RK.dish, G.flutes.range, outerG)] };
    }
  }

  // ---------------- place on the ground and set up views ----------------
  // explode offsets (mm): PCB lifts its bottom parts out of the body, the plate with its bosses and the light
  // pipes clears the key switches, caps and knobs clear the plate and the shaft tips
  const EXPLODE = [[screwG, -30], [pcbG, 18], [pipeG, 46], [plateG, 46], [capsG, 62], [outerG, 64], [innerG, 78]];
  // Where the parts stand. Exploded (e from 0 to 1) along the assembly axis, each part clear of the one below:
  // screws come up from under the body. Turned over (f from 0 to 1) to lie on its knobs with the underside up,
  // lifted on the way, so the edge that swings round clears the ground.
  const rest = [0, 0];            // the assembly over the ground: upright, turned over (0 until measured below)
  const pose = (e, f) => {
    for (const [g, dy] of EXPLODE) g.position.y = dy * e;
    assembly.rotation.x = TILT + Math.PI * f;
    assembly.position.y = rest[0] + (rest[1] - rest[0]) * f + Math.sin(Math.PI * f) * HO / 2;
  };
  const bounds = (e, f) => { pose(e, f); return new THREE.Box3().setFromObject(assembly); };
  for (const f of [0, 1]) rest[f] = SKIN - bounds(0, f).min.y;
  const boxes = [[bounds(0, 0), bounds(0, 1)], [bounds(1, 0)]];   // round the model: [exploded][turned over]
  // round the solid parts, seated: upright [0] and turned over [1]
  const layers = [0, 1].map(f => {
    pose(0, f); assembly.updateMatrixWorld();
    return [bodyG, pcbG, plateG, capsG].map(g => [g, new THREE.Box3().setFromObject(g)]);
  });
  const reach = boxes[1][0].min.distanceTo(boxes[1][0].max);   // no part is further from a point of the model
  pose(0, 0); assembly.updateMatrixWorld();                    // round the plate and the knobs, for the panel page
  const playBox = [plateG, outerG, innerG].reduce((b, g) => b.union(new THREE.Box3().setFromObject(g)), new THREE.Box3());

  // a view: the camera position as drawn (for a landscape window), what it looks at, exploded or not, turned over or not
  const view = (pos, tgt, exploded = 0, flipped = 0) => ({ pos0: new THREE.Vector3(...pos), pos: new THREE.Vector3(...pos), tgt: new THREE.Vector3(...tgt), exploded, flipped });
  const views = {
    A: view([-20, 215, 210], [0, 10, 0]),        // seated eye, about 45° above the desk
    E: view([-120, 225, 335], [0, 34, 0], 1),
    T: view([0, 340, 28], [0, 10, 0]),
    F: view([-45, 78, 270], [0, 8, 0]),
    B: view([-30, 270, 150], [0, 30, 0], 0, 1),  // the underside: the panel lies on its knobs
    H: view([-80, 140, 200], [-2, 9, 4]),        // stills only: hero close-up
    C: view([0, 2400, 0.01], [0, 0, 0]) };       // stills only: plan view from far above (nearly orthographic)
  // the panel page only (sim.js): from the top view's direction, as close as the plate and its knobs allow
  const playAt = playBox.getCenter(new THREE.Vector3());
  views.P = { ...view(new THREE.Vector3(0, 330, 28).setLength(1).add(playAt).toArray(), playAt.toArray()), box: playBox };
  const buttons = [...document.querySelectorAll('.bar button')];   // one per view, its id v and the view's key
  let cur = views.A, t = 1, step = 1, shot = false, plan = false, queued = false;
  const from = { pos: new THREE.Vector3(), tgt: new THREE.Vector3(), explode: 0, flip: 0 }, state = { explode: 0, flip: 0 };
  const invalidate = () => { if (!queued) { queued = true; requestAnimationFrame(frame); } };   // draw one frame

  // A view keeps its direction and backs off until the box round its model is inside the window, so a portrait
  // phone shows the whole panel too. It never comes closer than drawn, and the stills keep their framing.
  const up = new THREE.Vector3(0, 1, 0), fwd = new THREE.Vector3(), right = new THREE.Vector3(), upw = new THREE.Vector3(), p = new THREE.Vector3();
  function fit(v) {
    let dist = fwd.subVectors(v.pos0, v.tgt).length();
    fwd.normalize(); right.crossVectors(up, fwd).normalize(); upw.crossVectors(fwd, right);
    const tv = 0.94 * Math.tan(camera.fov * Math.PI / 360), th = tv * camera.aspect, b = v.box || boxes[v.exploded][v.flipped];   // a small margin
    if (!shot) for (let i = 0; i < 8; i++) {
      p.set(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z).sub(v.tgt);
      dist = Math.max(dist, p.dot(fwd) + Math.max(Math.abs(p.dot(right)) / th, Math.abs(p.dot(upw)) / tv));
    }
    v.pos.copy(v.tgt).addScaledVector(fwd, dist);
    return dist;
  }
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight, was = cur.pos.distanceTo(cur.tgt);
    if (!w || !h) return;                                   // hidden or collapsed: keep the camera
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    const far = Math.max(...buttons.map(b => fit(views[b.id[1]])));
    fit(cur);                                               // also a view without a button (the panel page's)
    controls.maxDistance = shot ? Infinity : 2 * far;
    // the camera stays where the user turned it, at the new distance
    camera.position.sub(controls.target).multiplyScalar(cur.pos.distanceTo(cur.tgt) / was).add(controls.target);
    invalidate();
  }

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function go(key, jump) {
    // without damping the update applies what is left of a drag at once, so the view lands exactly on its target
    controls.enabled = controls.enableDamping = false; controls.update();
    from.pos.copy(camera.position); from.tgt.copy(controls.target); from.explode = state.explode; from.flip = state.flip;
    cur = views[key]; fit(cur); t = 0; step = jump || reduce ? 1 : 0.028;
    for (const b of buttons) {
      b.classList.toggle('on', b.id === 'v' + key); b.setAttribute('aria-pressed', String(b.id === 'v' + key));
    }
    invalidate();
  }
  for (const b of buttons) b.addEventListener('click', () => go(b.id[1]));

  function applyTheme() {
    // the clear colour is not re-encoded: use the sRGB value as is
    scene.background = plan ? null : new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
    document.body.style.background = plan ? 'transparent' : '';
    invalidate();
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  // clean stills for the renders: #shot-h, -c, -e, -a and -b hide the page UI and show the hero close-up, the plan
  // view (on a transparent background, without the ground shadow), the exploded, the seated and the bottom view
  function readHash() {
    const m = location.hash.match(/^#shot-([hceab])$/);
    shot = !!m; plan = shot && m[1] === 'c';
    document.body.classList.toggle('clean', shot);
    camera.fov = plan ? 2.1 : 32; ground.visible = !plan;
    applyTheme(); resize(); go(shot ? m[1].toUpperCase() : 'A', true);
  }
  window.addEventListener('hashchange', readHash);
  window.addEventListener('resize', resize);
  canvas.addEventListener('webglcontextrestored', invalidate);

  // The point the camera turns about stays on a part, so panning cannot lose the model: it is held inside the
  // nearest of the boxes round the body, the board, the plate and the caps, each where its part stands now.
  const lift = new THREE.Vector3(0, Math.cos(TILT), Math.sin(TILT)), q = new THREE.Vector3();
  controls.addEventListener('change', () => {
    if (!shot && t >= 1) {
      let best = Infinity;
      for (const [g, b] of layers[cur.flipped]) {
        q.copy(controls.target).addScaledVector(lift, -g.position.y);
        const d = b.distanceToPoint(q);
        if (d < best) { best = d; b.clampPoint(q, p).sub(q); }
      }
      controls.target.add(p); camera.position.add(p);
    }
    invalidate();
  });

  // Frames are drawn on demand: while a view change runs, while the camera moves (the controls report it, also
  // while a drag coasts out) and after a resize, a colour scheme or a hash change.
  const ease = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  function frame() {
    queued = false;
    if (t < 1) {
      t = Math.min(1, t + step); const e = ease(t);
      camera.position.lerpVectors(from.pos, cur.pos, e);
      controls.target.lerpVectors(from.tgt, cur.tgt, e);
      pose(state.explode = from.explode + (cur.exploded - from.explode) * e, state.flip = from.flip + (cur.flipped - from.flip) * e);
      if (t < 1) invalidate(); else controls.enabled = controls.enableDamping = true;
    }
    controls.update();
    // the depth range follows the camera, tight round the model: faces SKIN apart stay apart from any distance
    const d = camera.position.distanceTo(controls.target);
    camera.near = Math.max(1, d - reach); camera.far = d + 2 * reach; camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    window.removeEventListener('error', onError);          // the view is up: a later error is not about loading it
  }
  readHash();
  // python3 -m sim.page serves this page with ?sim: the panel then plays, its firmware run by that program (sim.js)
  if (new URLSearchParams(location.search).has('sim')) {
    const s = document.createElement('script');
    s.src = 'sim.js';
    s.onload = () => window.playPanel({ G, camera, controls, canvas, assembly, go, invalidate, keys: keyList, knobs: KNOBS, lights: LIGHTS, px, pz });
    document.head.appendChild(s);
  }
}
main().catch(e => { console.error(e); fail(); });
</script>
