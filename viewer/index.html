<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avionics Panel</title>
<style>
  /* the cap font is served with the page (fonts/, SIL OFL), nothing loads from a font CDN */
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 500; src: url(fonts/BarlowSemiCondensed-Medium.ttf) format("truetype"); }
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 600; src: url(fonts/BarlowSemiCondensed-SemiBold.ttf) format("truetype"); }
  @font-face { font-family: "Barlow Semi Condensed"; font-weight: 700; src: url(fonts/BarlowSemiCondensed-Bold.ttf) format("truetype"); }
  /* layout: full-bleed 3D canvas; name and dimensions top-left, view switcher bottom-centre */
  :root {
    --bg: #e3e5e9; --ground: #d3d6db; --fg: #1c1e22; --muted: #5c6169;
    --panel: rgba(255,255,255,.88); --panel-fg: #1c1e22; --on: #1c1e22; --on-fg: #ffffff;
    --accent: #c9952f;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #34373d; --ground: #1f2227; --fg: #e7e8eb; --muted: #a4aab3;
      --panel: rgba(32,34,39,.9); --panel-fg: #e7e8eb; --on: #e7e8eb; --on-fg: #16181c;
      --accent: #d9a441; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #34373d; --ground: #1f2227; --fg: #e7e8eb; --muted: #a4aab3;
    --panel: rgba(32,34,39,.9); --panel-fg: #e7e8eb; --on: #e7e8eb; --on-fg: #16181c;
    --accent: #d9a441; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }
  .hdr { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px));
         left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
         pointer-events: none; display: flex; flex-direction: column; gap: 3px; }
  .hdr b { font-size: 17px; font-weight: 600; letter-spacing: .01em; text-wrap: balance; }
  .hdr span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { position: fixed; left: 50%; transform: translateX(-50%);
         bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px;
         background: var(--panel); padding: 5px; border-radius: 12px;
         box-shadow: 0 2px 14px rgba(0,0,0,.18); backdrop-filter: blur(8px); }
  .bar button { border: 0; background: transparent; padding: 8px 13px; border-radius: 9px;
                font: 500 14px var(--font); color: var(--panel-fg); cursor: pointer; }
  .bar button.on { background: var(--on); color: var(--on-fg); }
  .bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .legend { position: fixed; right: max(16px, env(safe-area-inset-right, 0px));
            bottom: calc(18px + env(safe-area-inset-bottom, 0px)); font: 12px var(--mono);
            color: var(--muted); pointer-events: none; text-align: right; line-height: 1.5; }
  body.clean .hdr, body.clean .bar, body.clean .legend { display: none; }
  .fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 560px) { .legend { display: none; } .bar button { padding: 8px 10px; font-size: 13px; } }
</style>
<canvas id="c"></canvas>
<div class="hdr">
  <b>Avionics Panel</b>
  <span id="dims"></span>
  <span>drag to rotate · scroll to zoom · right-drag to pan</span>
</div>
<div class="bar" role="group" aria-label="View">
  <button id="vA" class="on" type="button">Assembled</button>
  <button id="vE" type="button">Exploded</button>
  <button id="vT" type="button">Top</button>
  <button id="vF" type="button">Front</button>
</div>
<div class="legend">anodised aluminium plate · MJF nylon wedge body, 6°<br>28 keys · 3 dual knobs · range/pan</div>
<!-- three.js r128 (MIT, vendor/three-LICENSE) is served with the page: no request leaves the site -->
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="geometry.js"></script>
<script>
// ---------------- design data (mm; PCB coordinates: x to the right, y from the back edge towards the user) ----------------
// Every dimension comes from geometry.js, which mech/make_viewer_data.py writes from pcb/board.py, mech/stack.py,
// mech/make_mech.py and mech/make_caps.py. Only presentation lives here: labels, legends, colours, views.
const G = window.GEOMETRY;
const W = G.board.w, H = G.board.h, R = G.board.corner_r, CLEAR = G.body.clear, O = G.body.overhang;
const WO = W + 2 * O, HO = H + 2 * O, RO = R + O;
const PLATE_Z0 = G.plate.z0, PLATE_Z1 = G.plate.z1, Z_BOT = G.body.z_bot, Z_FLOOR = G.body.z_floor, PCB_T = G.board.t;
const TILT = G.body.tilt_deg * Math.PI / 180, SLOPE = Math.tan(TILT);
const COLS = G.keys.cols, ROWS = G.keys.rows;
const CAP = G.keys.cap, HOLE = G.plate.key_hole;   // [w, h, corner r]
// [label, shift] per key; UP / DN auto-repeat while held (100 ft/min or 1 kt per step)
const KEYS = [
  // autopilot columns: engage / vertical / lateral; VS and FLC sit next to UP and DN as on the G1000
  [['AP', 'TEST'],  ['ALT', 'ARM'], ['HDG', 'CRS CTR'], ['MIC 1', 'ADF'], ['COM 1', 'NAV 1'], ['CDI', 'OBS'],    ['COM⇆', '121.5']],
  [['FD', 'YD'],    ['VS', ''],    ['NAV', 'GPSS'], ['MIC 2', 'DME'], ['COM 2', 'NAV 2'], ['IDENT', 'VFR'],  ['NAV⇆', 'ADF ⇆']],
  [['UP', ''],      ['FLC', ''],   ['APR', 'BC'],    ['HOME', 'UNIT'], ['FPL', 'VNAV'],    ['D→', 'MSG'],     ['MENU', 'NRST']],
  [['DN', ''],      ['VNV', ''],   ['LVL', '½ BANK'],    ['SHIFT', ''],    ['PROC', 'TERR'],   ['CLR', 'MAP'],   ['ENT', '']]];
const KNOB_IN = G.inner_knob.d / 2;
const at = (name, extra) => ({ x: G.knobs[name].x, y: G.knobs[name].y, r: (G.knobs[name].d || 0) / 2, ...extra });
const KNOBS = {
  // legends sit on the near side of each knob (the far side is hidden behind the knob when seated)
  ap:    at('ALTHDG', { kind: 'dual',  main: [['ALT', 1], [' · HDG · PUSH SYNC', 0]], shift: [['CRS', 1], [' · BARO · PUSH STD', 0]] }),  // outer ALT, inner HDG (push SYNC); shifted outer CRS, inner BARO (push STD): the push always acts on the inner knob's function. Outer function in larger type.
  range: at('RANGE',  { kind: 'range', main: [['RANGE · PUSH PTR', 0]], shift: null }),
  radio: at('FREQ',   { kind: 'dual',  main: [['PUSH COM/NAV/ADF', 0]],  shift: [['SQUAWK · PUSH XPDR', 0]] }),
  fms:   at('FMS',    { kind: 'dual',  main: [['FMS · PUSH CRSR', 0]],   shift: null }) };   // larger, as on the G1000: told apart from FREQ by feel
// lights: SHIFT (amber) is on while SHIFT applies (pulsing in its last second), UNIT 2 (white) while unit 2 is selected
const light = name => ({ x: G.lights[name].x, y: G.lights[name].y, r: G.lights[name].d / 2 });
const LIGHTS = [
  { ...light('SHIFT'), color: 0x20180a, emissive: 0xd9a441, on: 1.0 },    // shown armed, same amber as the legends
  { ...light('UNIT'), color: 0x8c8f94, emissive: 0xffffff, on: 0.0 } ];   // shown off
const FRAME_M = 3.0;
// one engraved frame around all keys, split by single lines (no double rule between groups).
// Rows stay aligned across the panel on purpose; the extra 3.5 mm between rows 2 and 3 holds the FMS line.
const FRAME = { x0: COLS[0] - CAP[0] / 2 - FRAME_M, x1: COLS[6] + CAP[0] / 2 + FRAME_M,
                y0: ROWS[0] - CAP[1] / 2 - 4.2, y1: ROWS[3] + CAP[1] / 2 + 4.6,
                vAP: (COLS[2] + COLS[3]) / 2, vRadio: (COLS[4] + COLS[5]) / 2,          // AUDIO: talk / listen; RADIO: tuning
                hFMS: (ROWS[1] + CAP[1] / 2 + 2.6 + ROWS[2] - CAP[1] / 2) / 2 };
const MOUNTS = G.board.mounts, SUPPORTS = G.body.supports;
const SCREW_HEAD_Z = G.screw.head_z, SCREW_L = G.screw.length, LED_TOP = G.led_top, PIPE_Z0 = G.pipe.z0;
const USB_X = G.parts.usb_x, MCU = G.parts.mcu, FLASH = G.parts.flash, XTAL = G.parts.xtal, LDO = G.parts.ldo;   // bottom side
const CAP_FONT = '"Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", sans-serif';
const AMBER = '#d9a441', WHITE_ENGR = 'rgba(228,230,234,0.92)', PLATE_BASE = '#2d2f33';

const backH = PLATE_Z1 - Z_BOT + SLOPE * HO;
document.getElementById('dims').textContent =
  `${WO.toFixed(0)} × ${HO.toFixed(0)} mm · ${(PLATE_Z1 - Z_BOT).toFixed(0)} mm at the front, ${backH.toFixed(0)} mm at the back · caps 2.5 mm proud`;

async function main() {
  const canvas = document.getElementById('c');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
  catch (e) {
    const d = document.createElement('div'); d.className = 'fail';
    d.textContent = 'This view needs WebGL. Open the page in a current desktop or mobile browser.';
    document.body.appendChild(d); return;
  }
  // the legends are drawn into textures, so wait (briefly) for the condensed face
  try {
    await Promise.race([Promise.all(['500', '600', '700'].map(w => document.fonts.load(`${w} 40px "Barlow Semi Condensed"`))),
                        new Promise(r => setTimeout(r, 2500))]);
  } catch (e) { /* fall back to the stack */ }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 1, 3000);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI / 2 - 0.03;
  controls.target.set(0, 10, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x6d727a, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(-110, 230, 170);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = sun.shadow.camera.bottom = -150;
  sun.shadow.camera.right = sun.shadow.camera.top = 150;
  sun.shadow.camera.near = 10; sun.shadow.camera.far = 700;
  sun.shadow.bias = -0.0004;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.32); fill.position.set(190, 90, -140); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.22); rim.position.set(20, 60, -260); scene.add(rim);
  const front = new THREE.DirectionalLight(0xffffff, 0.25); front.position.set(0, 40, 300); scene.add(front);

  const groundMat = new THREE.ShadowMaterial({ opacity: 0.25 });   // only the shadow: no disc edge, no colour mismatch
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  // ---------------- helpers ----------------
  const px = x => x - W / 2, pz = y => y - H / 2;
  function rrectShape(w, h, r, cx = 0, cy = 0) {
    const s = new THREE.Shape(), x = cx - w / 2, y = cy - h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  function rrectPath(w, h, r, cx = 0, cy = 0) { const p = new THREE.Path(); p.curves = rrectShape(w, h, r, cx, cy).curves; return p; }
  function circlePath(cx, cy, r) { const p = new THREE.Path(); p.absarc(cx, cy, r, 0, Math.PI * 2, true); return p; }
  function slab(shape, z0, z1, mat, extra = {}) {
    const g = new THREE.ExtrudeGeometry(shape, Object.assign({ depth: z1 - z0, bevelEnabled: false, curveSegments: 16 }, extra));
    g.rotateX(-Math.PI / 2); g.translate(0, z0, 0);
    const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; return m;
  }
  function shearBottom(mesh, zBot) {
    const p = mesh.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) if (Math.abs(p.getY(i) - zBot) < 1e-4) p.setY(i, zBot - SLOPE * (HO / 2 - p.getZ(i)));
    p.needsUpdate = true; mesh.geometry.computeVertexNormals();
  }
  function mmTexture(c, wmm, hmm) {
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    t.repeat.set(1 / wmm, 1 / hmm); t.offset.set(0.5, 0.5);
    return t;
  }
  function box(group, w, h, d, x, y, z0, mat) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(px(x), z0 + h / 2, pz(y)); m.castShadow = true; group.add(m); return m;
  }
  const keyList = [];
  KEYS.forEach((row, r) => row.forEach((k, c) => { if (k) keyList.push({ x: COLS[c], y: ROWS[r], label: k[0], shift: k[1] }); }));

  // text along a circle, centred on angle `mid` (0 = towards +x, y towards the user). Letters face outward on
  // the far half and inward on the near half, so no legend is ever upside down for the seated user.
  // segs: [{ t, font }] so one legend can mix sizes (outer-ring function larger)
  function arcText(g, segs, cx, cy, r, mid, color, track) {
    const near = Math.sin(mid) > 0.01;
    g.save(); g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
    const chars = segs.flatMap(s => [...s.t].map(ch => ({ ch, font: s.font })));
    const ws = chars.map(c => { g.font = c.font; return g.measureText(c.ch).width + track; });
    const total = ws.reduce((a, b) => a + b, 0) - track;
    let acc = 0;
    chars.forEach((c, i) => {
      const off = (acc + (ws[i] - track) / 2 - total / 2) / r;
      const a = near ? mid - off : mid + off;
      g.save(); g.font = c.font; g.translate(cx + r * Math.cos(a), cy + r * Math.sin(a));
      g.rotate(near ? a - Math.PI / 2 : a + Math.PI / 2); g.fillText(c.ch, 0, 0); g.restore();
      acc += ws[i];
    });
    g.restore();
  }

  const assembly = new THREE.Group();
  assembly.rotation.x = TILT;
  scene.add(assembly);

  // ---------------- materials (sRGB colours converted to linear for the sRGB output) ----------------
  const M = (o) => { const m = new THREE.MeshStandardMaterial(o); m.color.convertSRGBToLinear(); return m; };
  const bodyMat   = M({ color: 0x27282b, roughness: 0.93 });
  const plateSide = M({ color: 0x4a4d53, roughness: 0.42, metalness: 0.65 });
  const capMat    = M({ color: 0x1b1c1f, roughness: 0.5 });
  const dark      = M({ color: 0x15161a, roughness: 0.6 });
  const metal     = M({ color: 0xb9bcc2, roughness: 0.35, metalness: 0.9 });
  const pcbSide   = M({ color: 0x1e3a2c, roughness: 0.7 });

  // ---------------- body: wedge floor + walls ----------------
  const bodyG = new THREE.Group(); assembly.add(bodyG);
  {
    const floor = slab(rrectShape(WO, HO, RO), Z_BOT, Z_FLOOR, bodyMat);
    shearBottom(floor, Z_BOT); bodyG.add(floor);
    const ring = rrectShape(WO, HO, RO);
    ring.holes.push(rrectPath(W + 2 * CLEAR, H + 2 * CLEAR, R + CLEAR));
    bodyG.add(slab(ring, Z_FLOOR, PLATE_Z0 - G.body.wall_gap, bodyMat));   // walls stop short: the spacers set the plate height
    const post = (x, y, r, rIn) => {                               // from the floor up to the PCB underside (mech/make_mech.py)
      const sh = new THREE.Shape(); sh.absarc(0, 0, r, 0, Math.PI * 2, false);
      if (rIn) sh.holes.push(circlePath(0, 0, rIn));
      const m = slab(sh, Z_FLOOR, -PCB_T, bodyMat); m.position.set(px(x), 0, pz(y)); bodyG.add(m);
    };
    for (const [mx, my] of MOUNTS) post(mx, my, G.body.boss_r, G.body.boss_hole_r);   // bosses: the screws come up through them
    for (const [sx, sy] of SUPPORTS) post(sx, sy, G.body.support_r);                  // two posts under the middle of the PCB
    box(bodyG, 9.4, 3.6, 2.6, USB_X, -O + 1.0, -PCB_T - 3.4, dark);
    box(bodyG, 8.6, 2.8, 1.0, USB_X, -O + 0.6, -PCB_T - 3.0, metal);
  }

  // ---------------- PCB ----------------
  const pcbG = new THREE.Group(); assembly.add(pcbG);
  {
    const c = document.createElement('canvas'); const ppm = 10;
    c.width = Math.round(W * ppm); c.height = Math.round(H * ppm);
    const g = c.getContext('2d');
    g.fillStyle = '#0e1012'; g.fillRect(0, 0, c.width, c.height);
    g.strokeStyle = 'rgba(70,74,80,0.55)'; g.lineWidth = 0.25 * ppm;
    const KDX = G.board.key_pad_dx, KDY = G.board.key_pad_dy;
    for (const k of keyList) { g.beginPath(); g.moveTo((k.x - KDX) * ppm, (k.y - KDY) * ppm); g.lineTo((k.x + KDX) * ppm, (k.y - KDY) * ppm); g.stroke(); }
    const pad = (x, y, r) => { g.beginPath(); g.arc(x * ppm, y * ppm, r * ppm, 0, Math.PI * 2); g.fill(); };
    g.fillStyle = '#4d4430';                            // dull pads: bright gold showed through the key holes like stray legends
    for (const k of keyList) for (const sx of [-1, 1]) for (const sy of [-1, 1]) pad(k.x + sx * KDX, k.y + sy * KDY, 0.9);
    for (const k of Object.values(KNOBS)) {
      for (const dx of [-2.5, 0, 2.5]) pad(k.x + dx, k.y + 7.5, 0.9);
      for (const dx of [-2.5, 2.5]) pad(k.x + dx, k.y - 7.0, 0.9);
      if (k.kind === 'dual') for (const dx of [-2.5, 0, 2.5]) pad(k.x + dx, k.y - 9.5, 0.9);
      if (k.kind === 'range') for (const dy of [-2.5, 0, 2.5]) pad(k.x + 8.5, k.y + dy, 0.85);
      g.fillRect((k.x - 6.75) * ppm, (k.y - 1.8) * ppm, 2.5 * ppm, 3.6 * ppm);
      g.fillRect((k.x + 4.25) * ppm, (k.y - 1.8) * ppm, 2.5 * ppm, 3.6 * ppm);
    }
    g.fillStyle = '#d3d6db';
    for (const [mx, my] of MOUNTS) pad(mx, my, G.board.mount_hole / 2);
    const shape = rrectShape(W, H, R);
    for (const [mx, my] of MOUNTS) shape.holes.push(circlePath(px(mx), -pz(my), G.board.mount_hole / 2));
    const topMat = new THREE.MeshStandardMaterial({ map: mmTexture(c, W, H), roughness: 0.75 });
    pcbG.add(slab(shape, -PCB_T, 0, [topMat, pcbSide]));
    const under = h => -PCB_T - h;
    box(pcbG, 7, 0.9, 7, MCU[0], MCU[1], under(0.9), dark);
    box(pcbG, 5.3, 1.5, 4.0, FLASH[0], FLASH[1], under(1.5), dark);
    box(pcbG, 8.9, 3.2, 7.3, USB_X, 3.6, under(3.2), metal);
    box(pcbG, 3.2, 0.8, 2.5, XTAL[0], XTAL[1], under(0.8), metal);
    box(pcbG, 2.9, 1.1, 1.3, LDO[0], LDO[1], under(1.1), dark);         // SOT-23 regulator
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2, rr = 5.6 + (i % 2) * 1.0;
      box(pcbG, 1.6, 0.8, 0.8, MCU[0] + Math.cos(a) * rr, MCU[1] + Math.sin(a) * rr, under(0.8), i % 4 ? dark : metal);
    }
    for (const k of keyList) {
      box(pcbG, 2.6, 0.9, 1.2, k.x, k.y + 4.6, under(0.9), dark);
      box(pcbG, 6, 3.5, 6, k.x, k.y, 0, dark);
      const top = G.keys.plunger_top;                                  // plunger from the 3.5 mm switch body up
      const st = new THREE.Mesh(new THREE.CylinderGeometry(1.75, 1.75, top - 3.5, 16), dark); st.position.set(px(k.x), (top + 3.5) / 2, pz(k.y)); pcbG.add(st);
    }
    for (const k of Object.values(KNOBS)) {
      const dual = k.kind === 'dual';
      const E = G.encoder, J = G.rkjxt;
      box(pcbG, dual ? 11.7 : 12, dual ? E.body : J.body, 12, k.x, k.y, 0, dual ? metal : dark);   // PEC11D body 11.7 x 12
      const shaft = (r, z0, z1) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, z1 - z0, 24), metal); m.position.set(px(k.x), (z0 + z1) / 2, pz(k.y)); pcbG.add(m); };
      if (dual) {                                                                // bushing, outer shaft, inner shaft
        shaft(E.sleeve_d / 2, E.body, E.sleeve_top); shaft(E.outer_d / 2, E.sleeve_top, E.outer_top);
        shaft(E.inner_d / 2, E.outer_top, E.inner_top);
      } else { shaft(2, J.body, J.hub_top); shaft(J.lever_d / 2, J.hub_top, J.lever_z1); }   // RKJXT hub and lever
    }
    for (const L of LIGHTS) {                                                    // 3 mm LEDs under the light pipes
      const led = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, LED_TOP - 0.8, 24), M({ color: L.emissive, roughness: 0.3, transparent: true, opacity: 0.75 }));
      led.position.set(px(L.x), (LED_TOP - 0.8) / 2, pz(L.y)); pcbG.add(led);
      const dome = new THREE.Mesh(new THREE.SphereGeometry(1.5, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), led.material);
      dome.position.set(px(L.x), LED_TOP - 1.5 + 0.7, pz(L.y)); dome.scale.y = 0.8 / 1.5; pcbG.add(dome);
    }
  }

  // ---------------- screws (below the body) and spacers (between PCB and plate) ----------------
  const screwG = new THREE.Group(); assembly.add(screwG);
  const spacerG = new THREE.Group(); assembly.add(spacerG);
  {
    const steel = M({ color: 0x2a2b2e, roughness: 0.45, metalness: 0.8 });     // black oxide
    for (const [mx, my] of MOUNTS) {
      const head = new THREE.Mesh(new THREE.CylinderGeometry(2.25, 2.25, 2.5, 24), steel);
      head.position.set(px(mx), SCREW_HEAD_Z - 1.25, pz(my)); screwG.add(head);
      const hex = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.05, 6), dark);
      hex.position.set(px(mx), SCREW_HEAD_Z - 2.52, pz(my)); screwG.add(hex);
      const shank = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, SCREW_L, 16), steel);
      shank.position.set(px(mx), SCREW_HEAD_Z + SCREW_L / 2, pz(my)); screwG.add(shank);
      const sh = new THREE.Shape(); sh.absarc(0, 0, G.spacer.od / 2, 0, Math.PI * 2, false); sh.holes.push(circlePath(0, 0, G.spacer.id / 2));
      const sp = slab(sh, 0, G.spacer.length, bodyMat); sp.position.set(px(mx), 0, pz(my)); spacerG.add(sp);
    }
  }

  // ---------------- front plate (anodised aluminium, engraved legends) ----------------
  const plateG = new THREE.Group(); assembly.add(plateG);
  const pipeG = new THREE.Group(); assembly.add(pipeG);
  {
    const ppm = 12;
    const c = document.createElement('canvas');
    c.width = Math.round(WO * ppm); c.height = Math.round(HO * ppm);
    const g = c.getContext('2d');
    const X = x => (x + O) * ppm, Y = y => (y + O) * ppm;
    g.fillStyle = PLATE_BASE; g.fillRect(0, 0, c.width, c.height);
    for (let y = 0; y < c.height; y += 1) {
      g.strokeStyle = `rgba(255,255,255,${(Math.random() * 0.05).toFixed(3)})`; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(c.width, y + 0.5); g.stroke();
    }
    const mmFont = (mm, weight = 600) => `${weight} ${Math.round(mm * ppm / 0.72)}px ${CAP_FONT}`;
    const spaced = (text, x, y, font, color, trackMm, align = 'center') => {
      g.font = font; g.fillStyle = color; g.textBaseline = 'middle';
      const chars = [...text], ws = chars.map(ch => g.measureText(ch).width);
      const total = ws.reduce((a, b) => a + b, 0) + trackMm * ppm * (chars.length - 1);
      let cx = align === 'center' ? x - total / 2 : x;
      g.textAlign = 'left';
      chars.forEach((ch, i) => { g.fillText(ch, cx, y); cx += ws[i] + trackMm * ppm; });
      return total;
    };
    // group frames, the title breaking the line
    const rr = (x0, y0, x1, y1, r) => { g.beginPath(); g.moveTo(x0 + r, y0); g.lineTo(x1 - r, y0); g.quadraticCurveTo(x1, y0, x1, y0 + r);
      g.lineTo(x1, y1 - r); g.quadraticCurveTo(x1, y1, x1 - r, y1); g.lineTo(x0 + r, y1); g.quadraticCurveTo(x0, y1, x0, y1 - r);
      g.lineTo(x0, y0 + r); g.quadraticCurveTo(x0, y0, x0 + r, y0); g.closePath(); };
    const title = (text, x, y) => {
      g.font = mmFont(1.75, 600);
      const w = [...text].reduce((a, ch) => a + g.measureText(ch).width, 0) + 0.32 * ppm * (text.length - 1);
      g.fillStyle = PLATE_BASE; g.fillRect(x - 0.7 * ppm, y - 1.3 * ppm, w + 1.4 * ppm, 2.6 * ppm);
      spaced(text, x, y, mmFont(1.75, 600), WHITE_ENGR, 0.32, 'left');
    };
    g.lineWidth = 0.3 * ppm; g.strokeStyle = 'rgba(214,217,222,0.62)';
    {
      const f = FRAME, line = (x0, y0, x1, y1) => { g.beginPath(); g.moveTo(X(x0), Y(y0)); g.lineTo(X(x1), Y(y1)); g.stroke(); };
      rr(X(f.x0), Y(f.y0), X(f.x1), Y(f.y1), 1.6 * ppm); g.stroke();
      line(f.vAP, f.y0, f.vAP, f.y1);                 // AUTOPILOT | rest
      line(f.vAP, f.hFMS, f.x1, f.hFMS);              // AUDIO / RADIO above, FMS below
      line(f.vRadio, f.y0, f.vRadio, f.hFMS);         // AUDIO | RADIO
      title('AUTOPILOT', X(f.x0 + 3.5), Y(f.y0));
      title('AUDIO', X(f.vAP + 3.0), Y(f.y0));
      title('RADIO', X(f.vRadio + 3.0), Y(f.y0));
      title('FMS', X(f.vAP + 3.0), Y(f.hFMS));
    }
    // shift legends under the keys (amber = shifted, as on the SHIFT cap)
    // 1.7 mm tall, centred 1.6 mm below the cap: clear of the hole chamfer (0.7 mm) and of the next row's caps down to ~40° eye height
    for (const k of keyList) if (k.shift) spaced(k.shift, X(k.x), Y(k.y + CAP[1] / 2 + 1.6), mmFont(1.7, 600), AMBER, 0.08);
    // knob legends on arcs: white = turn, amber = with SHIFT
    // legends on the side facing the keys: seated, the near side of a rear knob is hidden behind the front knob
    for (const k of Object.values(KNOBS)) {
      const tilt = (k.y < H / 2 ? 15 : 35) * Math.PI / 180;           // turned towards the user, clear of the knob behind
      const mid = k.x < W / 2 ? tilt : Math.PI - tilt;
      const r0 = (k.kind === 'range' ? 12.2 : k.r + 1.9) * ppm;   // legend radius: presentation
      const segs = (list, base, big) => list.map(([t, b]) => ({ t, font: b ? mmFont(big, 700) : mmFont(base, 600) }));
      arcText(g, segs(k.main, 1.55, 1.95), X(k.x), Y(k.y), r0, mid, WHITE_ENGR, 0.22 * ppm);
      if (k.shift) arcText(g, segs(k.shift, 1.5, 1.85), X(k.x), Y(k.y), r0 + 2.2 * ppm, mid, AMBER, 0.22 * ppm);
    }
    // pan arrows around RANGE, in the four pan directions
    {
      const k = KNOBS.range; g.fillStyle = WHITE_ENGR;
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2, rr0 = 9.4 * ppm;
        g.save(); g.translate(X(k.x) + Math.cos(a) * rr0, Y(k.y) + Math.sin(a) * rr0); g.rotate(a);
        g.beginPath(); g.moveTo(0.75 * ppm, 0); g.lineTo(-0.45 * ppm, -0.7 * ppm); g.lineTo(-0.45 * ppm, 0.7 * ppm); g.closePath(); g.fill(); g.restore();
      }
    }
    const topMat = new THREE.MeshStandardMaterial({ map: mmTexture(c, WO, HO), roughness: 0.5, metalness: 0.3 });
    const bs = 0.4;
    const s = rrectShape(WO - 2 * bs, HO - 2 * bs, RO - bs);
    for (const k of keyList) s.holes.push(rrectPath(HOLE[0] + 2 * bs, HOLE[1] + 2 * bs, HOLE[2] + bs, px(k.x), -pz(k.y)));
    for (const k of Object.values(KNOBS)) s.holes.push(circlePath(px(k.x), -pz(k.y), (k.kind === 'range' ? G.plate.range_hole : G.plate.shaft_hole) / 2 + bs));
    for (const L of LIGHTS) s.holes.push(circlePath(px(L.x), -pz(L.y), L.r + bs));
    const geo = new THREE.ExtrudeGeometry(s, { depth: PLATE_Z1 - PLATE_Z0 - 2 * bs, bevelEnabled: true, bevelThickness: bs, bevelSize: bs, bevelOffset: 0, bevelSegments: 2, curveSegments: 16 });
    geo.rotateX(-Math.PI / 2); geo.translate(0, PLATE_Z0 + bs, 0);
    const plate = new THREE.Mesh(geo, [topMat, plateSide]); plate.castShadow = true; plate.receiveShadow = true;
    plateG.add(plate);
    // annunciators: light-pipe lenses flush with the plate, LEDs on the PCB
    for (const L of LIGHTS) {
      const lensMat = new THREE.MeshStandardMaterial({ color: L.color, emissive: L.emissive, emissiveIntensity: L.on, roughness: 0.3 });
      lensMat.color.convertSRGBToLinear(); lensMat.emissive.convertSRGBToLinear();
      const lens = new THREE.Mesh(new THREE.CylinderGeometry(L.r, L.r, 0.1, 32), lensMat);   // flat lens, flush with the plate
      lens.position.set(px(L.x), PLATE_Z1 + 0.03, pz(L.y)); plateG.add(lens);
      const pipeMat = M({ color: 0xdfe6ea, roughness: 0.15, transparent: true, opacity: 0.55 });   // clear resin, collar under the plate
      const rr = L.r - G.pipe.clear / 2;                                   // slip fit in its hole
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(rr, rr, PLATE_Z1 - 0.05 - PIPE_Z0, 24), pipeMat);
      rod.position.set(px(L.x), (PLATE_Z1 - 0.05 + PIPE_Z0) / 2, pz(L.y)); pipeG.add(rod);
      const collar = new THREE.Mesh(new THREE.CylinderGeometry(G.pipe.collar_d / 2, G.pipe.collar_d / 2, PLATE_Z0 - PIPE_Z0, 24), pipeMat);
      collar.position.set(px(L.x), (PLATE_Z0 + PIPE_Z0) / 2, pz(L.y)); pipeG.add(collar);
    }
  }

  // ---------------- caps: one legend size for every cap, condensed face, Garmin glyphs ----------------
  const capsG = new THREE.Group(); assembly.add(capsG);
  const CB = G.keys.cap_chamfer, CAP_TOP = [CAP[0] - 2 * CB, CAP[1] - 2 * CB];
  const meas = document.createElement('canvas').getContext('2d');
  const ICON_EM = 0.6;                                   // width of the flip-flop icon in em; narrow, so COM ⇆ doesn't shrink every legend
  function labelWidthEm(label) {
    meas.font = `600 100px ${CAP_FONT}`;
    if (label === 'D→') return meas.measureText('D').width / 100 + 0.55;
    if (label.endsWith('⇆')) return meas.measureText(label.slice(0, -1)).width / 100 + 0.22 + ICON_EM;
    return meas.measureText(label).width / 100;
  }
  const EM_MM = Math.min(3.1, ...keyList.map(k => CAP_TOP[0] * 0.84 / labelWidthEm(k.label)));
  function capTexture(label, color, bg) {
    const c = document.createElement('canvas'), k = 56;
    c.width = Math.round(CAP_TOP[0] * k); c.height = Math.round(CAP_TOP[1] * k);
    const g = c.getContext('2d');
    g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
    const em = EM_MM * k, cx = c.width / 2, cy = c.height / 2 + 0.04 * em;
    g.font = `600 ${em}px ${CAP_FONT}`; g.fillStyle = color; g.strokeStyle = color; g.textBaseline = 'middle';
    const capH = 0.7 * em;
    if (label === 'D→') {                                // Garmin direct-to: a D with an arrow through it
      const dw = g.measureText('D').width, x0 = cx - (dw + 0.55 * em) / 2;
      g.textAlign = 'left'; g.fillText('D', x0, cy);
      const y = cy - 0.02 * em, xe = x0 + dw + 0.55 * em;
      g.lineWidth = 0.085 * em; g.lineCap = 'butt';
      g.beginPath(); g.moveTo(x0 - 0.12 * em, y); g.lineTo(xe - 0.2 * em, y); g.stroke();
      g.beginPath(); g.moveTo(xe, y); g.lineTo(xe - 0.26 * em, y - 0.17 * em); g.lineTo(xe - 0.26 * em, y + 0.17 * em); g.closePath(); g.fill();
    } else if (label.endsWith('⇆')) {                    // flip-flop: text + two opposed arrows
      const t = label.slice(0, -1), tw = g.measureText(t).width, iw = ICON_EM * em, gap = 0.22 * em;
      const x0 = cx - (tw + gap + iw) / 2;
      g.textAlign = 'left'; g.fillText(t, x0, cy);
      const ix = x0 + tw + gap, dy = capH * 0.24, hl = 0.22 * em, hh = 0.13 * em;
      g.lineWidth = 0.075 * em;
      g.beginPath(); g.moveTo(ix, cy - dy); g.lineTo(ix + iw - hl, cy - dy); g.stroke();
      g.beginPath(); g.moveTo(ix + iw, cy - dy); g.lineTo(ix + iw - hl, cy - dy - hh); g.lineTo(ix + iw - hl, cy - dy + hh); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(ix + hl, cy + dy); g.lineTo(ix + iw, cy + dy); g.stroke();
      g.beginPath(); g.moveTo(ix, cy + dy); g.lineTo(ix + hl, cy + dy - hh); g.lineTo(ix + hl, cy + dy + hh); g.closePath(); g.fill();
    } else {
      g.textAlign = 'center'; g.fillText(label, cx, cy);
    }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
  }
  for (const key of keyList) {
    const height = G.keys.cap_height, base = G.keys.cap_base;   // LVL is a normal black cap: the corner marks it
    const geo = new THREE.ExtrudeGeometry(rrectShape(CAP_TOP[0], CAP_TOP[1], 1.0), { depth: height - CB, bevelEnabled: true, bevelSize: CB, bevelThickness: CB, bevelSegments: 3, curveSegments: 8 });
    geo.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(geo, capMat); m.position.set(px(key.x), base, pz(key.y)); m.castShadow = true; capsG.add(m);
    const color = key.label === 'SHIFT' ? AMBER : '#f3f3f3';
    const bg = '#1b1c1f';
    const top = new THREE.Mesh(new THREE.PlaneGeometry(CAP_TOP[0], CAP_TOP[1]),
      new THREE.MeshStandardMaterial({ map: capTexture(key.label, color, bg), roughness: 0.5 }));
    top.rotation.x = -Math.PI / 2; top.position.set(px(key.x), base + height + 0.02, pz(key.y)); capsG.add(top);
    // tactile bars, found without looking: SHIFT and DN at the front edge, UP at the back edge
    const barEdge = { SHIFT: 1, DN: 1, UP: -1 }[key.label];
    if (barEdge) {
      const B = G.keys.bar;                                  // as printed (mech/make_caps.py)
      const bar = new THREE.Mesh(new THREE.BoxGeometry(B.w, B.proud, B.d), capMat);
      bar.position.set(px(key.x), base + height + B.proud / 2, pz(key.y) + barEdge * (CAP_TOP[1] / 2 - B.inset)); bar.castShadow = true; capsG.add(bar);
    }
  }

  // ---------------- knobs and wheel ----------------
  // avionics-style knobs: matte black plastic, slight taper, fine vertical flutes, chamfered flat top.
  // Short outer ring, inner knob standing clearly above it (Garmin / Bendix-King proportions).
  // No index line: the encoders turn endlessly, a pointer would suggest an absolute position.
  const knobPlastic = M({ color: 0x151617, roughness: 0.6, metalness: 0.0 });
  const outerG = new THREE.Group(), innerG = new THREE.Group(); assembly.add(outerG, innerG);
  function knob(x, y, r, z0, h, flutes, depth, taper, grp) {
    const s = new THREE.Shape(), N = flutes * 10;
    for (let i = 0; i <= N; i++) {
      const a = i / N * Math.PI * 2;
      const groove = Math.pow(Math.max(0, Math.cos(flutes * a)), 6);     // narrow grooves, wide lands
      const rr = r - depth * groove;
      i ? s.lineTo(rr * Math.cos(a), rr * Math.sin(a)) : s.moveTo(rr * Math.cos(a), rr * Math.sin(a));
    }
    const bv = Math.min(0.7, r * 0.08);
    const g = new THREE.ExtrudeGeometry(s, { depth: h - 2 * bv, bevelEnabled: true, bevelThickness: bv, bevelSize: bv, bevelOffset: -bv, bevelSegments: 3, curveSegments: 1 });
    g.rotateX(-Math.PI / 2);
    const p = g.attributes.position;                     // taper: narrower towards the top
    for (let i = 0; i < p.count; i++) {
      const t = (p.getY(i) + bv) / h, k = 1 - taper * t;
      p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k);
    }
    p.needsUpdate = true; g.computeVertexNormals();
    const m = new THREE.Mesh(g, knobPlastic);
    m.position.set(px(x), z0 + bv, pz(y)); m.castShadow = true; m.receiveShadow = true; grp.add(m);
  }
  for (const k of Object.values(KNOBS)) {
    const R = k.r, OK = G.outer_knob, IK = G.inner_knob, RK = G.range_knob;
    if (k.kind === 'dual') {
      knob(k.x, k.y, R, PLATE_Z1 + OK.z0, OK.z1 - OK.z0, Math.round(R * 3.3), 0.45, 0.05, outerG);   // outer ring (mech/make_knobs.py)
      knob(k.x, k.y, KNOB_IN, PLATE_Z1 + IK.z0, IK.z1 - IK.z0, 24, 0.32, 0.06, innerG);            // inner knob, on the shaft tip
    } else {                                                  // RANGE: turns, tilts to pan, pushes; skirt hides the tilt opening
      const sk = new THREE.Mesh(new THREE.CylinderGeometry(RK.d / 2, RK.skirt_d / 2, 1.0, 64), knobPlastic);
      sk.position.set(px(k.x), PLATE_Z1 + RK.z0 + 0.5, pz(k.y)); sk.castShadow = true; outerG.add(sk);
      knob(k.x, k.y, RK.d / 2, PLATE_Z1 + RK.z0 + 0.8, RK.z1 - RK.z0 - 0.8, 22, 0.32, 0.05, outerG);
    }
  }

  // ---------------- place on the ground and set up views ----------------
  // explode offsets (mm): PCB lifts its bottom parts out of the body, spacers clear the key switches,
  // light pipes and plate clear the spacers, caps and knobs clear the plate and the shaft tips
  const EXPLODE = [[screwG, -30], [pcbG, 18], [spacerG, 30], [pipeG, 36], [plateG, 46], [capsG, 62], [outerG, 64], [innerG, 78]];
  assembly.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(assembly);
  assembly.position.y = -bb.min.y + 0.01;

  const views = {
    A: { pos: new THREE.Vector3(-20, 215, 210), tgt: new THREE.Vector3(0, 10, 0), explode: 0 },   // seated eye, about 45° above the desk
    E: { pos: new THREE.Vector3(-120, 225, 335), tgt: new THREE.Vector3(0, 34, 0), explode: 1 },
    T: { pos: new THREE.Vector3(0, 340, 28),    tgt: new THREE.Vector3(0, 10, 0), explode: 0 },
    F: { pos: new THREE.Vector3(-45, 78, 270),  tgt: new THREE.Vector3(0, 8, 0),  explode: 0 } };
  let cur = views.A, t = 1;
  const from = { pos: views.A.pos.clone(), tgt: views.A.tgt.clone(), explode: 0 }, state = { explode: 0 };
  camera.position.copy(views.A.pos);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function go(key) {
    from.pos.copy(camera.position); from.tgt.copy(controls.target); from.explode = state.explode;
    cur = views[key]; t = reduce ? 1 : 0; controls.enabled = false;
    for (const b of document.querySelectorAll('.bar button')) b.classList.toggle('on', b.id === 'v' + key);
  }
  for (const k of ['A', 'E', 'T', 'F']) document.getElementById('v' + k).addEventListener('click', () => go(k));
  // clean stills for sharing: #shot-a / -e / -t / -f / -h hide the page UI and jump to that view (h = hero close-up);
  // #shot-c is a plan view from far above (nearly orthographic) on a transparent background, without the ground shadow
  views.H = { pos: new THREE.Vector3(-80, 140, 200), tgt: new THREE.Vector3(-2, 9, 4), explode: 0 };
  views.C = { pos: new THREE.Vector3(0, 2400, 0.01), tgt: new THREE.Vector3(0, 0, 0), explode: 0 };
  const shot = (location.hash || '').match(/^#shot-([aetfhc])$/);
  const plan = shot && shot[1] === 'c';
  if (shot) {
    document.body.classList.add('clean');
    cur = views[shot[1].toUpperCase()]; t = 1;
    camera.position.copy(cur.pos); controls.target.copy(cur.tgt); state.explode = cur.explode;
    if (plan) { camera.fov = 2.1; camera.far = 5000; camera.updateProjectionMatrix(); ground.visible = false; }
  }

  function applyTheme() {
    if (plan) { scene.background = null; document.body.style.background = 'transparent'; return; }
    const cs = getComputedStyle(document.documentElement);
    scene.background = new THREE.Color(cs.getPropertyValue('--bg').trim() || '#e3e5e9');   // the clear colour is not re-encoded: use the sRGB value as is
  }
  applyTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) {
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
  }
  const ease = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  function frame() {
    resize();
    if (t < 1) {
      t = Math.min(1, t + 0.028); const e = ease(t);
      camera.position.lerpVectors(from.pos, cur.pos, e);
      controls.target.lerpVectors(from.tgt, cur.tgt, e);
      state.explode = from.explode + (cur.explode - from.explode) * e;
      if (t >= 1) controls.enabled = true;
    }
    // exploded along the assembly axis, each part clear of the one below: screws come up from under the body
    for (const [g, dy] of EXPLODE) g.position.y = dy * state.explode;
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
}
main();
</script>
